<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Number Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: graph-paper notebook — narrow column, sticky score bar, one task card at a time */
:root {
  --paper: #f5f7fc;
  --grid: #e1e7f4;
  --card: #ffffff;
  --ink: #17213b;
  --muted: #5b6784;
  --line: #ccd5e8;
  --pen: #2146c4;
  --pen-soft: #e2e8fb;
  --ok: #12804e;
  --ok-soft: #dcf2e6;
  --bad: #c42c38;
  --bad-soft: #fbe2e4;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
    --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
    --bad: #ff7b85; --bad-soft: #3b1920; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
  --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
  --bad: #ff7b85; --bad-soft: #3b1920; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.5 var(--f-ui);
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 580px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand { font: 800 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font: 400 .72rem/1.3 var(--f-ui); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
.score { margin-left: auto; text-align: right; position: relative; }
.score b { font: 800 1.7rem/1 var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.score span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.delta {
  position: absolute; right: 0; top: -2px; font: 800 1rem/1 var(--f-display);
  animation: float 1.1s ease-out forwards; pointer-events: none;
}
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
@keyframes float { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px;
  width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; }

.stats {
  max-width: 580px; margin: 0 auto; padding: 0 16px 8px;
  display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b { color: var(--ink); font-weight: 700; }
.stats .streak b { color: var(--pen); }

main { max-width: 580px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card > *, .panel > * { min-width: 0; }

.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  display: grid; gap: 12px;
}
.panel h3 { margin: 0; font: 600 1rem/1.2 var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: transparent; border-radius: 999px;
  padding: 8px 14px; cursor: pointer; font-size: .9rem;
}
.chip[aria-pressed="true"] { background: var(--pen-soft); border-color: var(--pen); color: var(--ink); font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: .82rem; color: var(--muted); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px 16px 16px; display: grid; gap: 14px;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px color-mix(in srgb, var(--pen) 45%, transparent);
}
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.eyebrow b { color: var(--pen); }
.prompt { margin: 0; font: 600 1.12rem/1.3 var(--f-display); text-wrap: balance; }
.expr {
  font: 400 1.9rem/1.3 var(--f-math); text-align: center; padding: 4px 0;
  white-space: nowrap; overflow-x: auto;
}
.expr i, .opt i, .explain i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.08; margin: 0 .08em; }
.frac > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
.rt { white-space: nowrap; }
.rad { border-top: .07em solid currentColor; padding: .04em .08em 0; margin-left: -.02em; }

.axis-wrap { touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; margin: 0 -6px; }
.axis-wrap.locked { cursor: default; }
svg.axis { display: block; width: 100%; height: auto; overflow: visible; }
.ax-line { stroke: var(--ink); stroke-width: 1.6; }
.ax-arrow { stroke: var(--ink); stroke-width: 1.6; fill: none; stroke-linejoin: round; }
.tick { stroke: var(--ink); stroke-width: 1.3; }
.tlabel { fill: var(--muted); font: 12px var(--f-ui); text-anchor: middle; font-variant-numeric: tabular-nums; }
.tlabel.zero { fill: var(--ink); font-weight: 700; }
.iv { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pt { stroke-width: 2.4; }
.c-pen { stroke: var(--pen); } .pt.c-pen.closed { fill: var(--pen); }
.c-ok { stroke: var(--ok); } .pt.c-ok.closed { fill: var(--ok); }
.c-bad { stroke: var(--bad); } .pt.c-bad.closed { fill: var(--bad); }
.pt.open { fill: var(--card); }
.seg { stroke-width: 1.5; }
.seg.c-pen { fill: var(--pen-soft); } .seg.c-ok { fill: var(--ok-soft); } .seg.c-bad { fill: var(--bad-soft); }
.pin.c-pen { fill: var(--pen); } .pin.c-ok { fill: var(--ok); } .pin.c-bad { fill: var(--bad); }
.pinline { stroke-width: 2; }

.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool {
  border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 8px 4px 7px;
  display: grid; justify-items: center; gap: 3px; cursor: pointer; font-size: .78rem; line-height: 1.2; color: var(--muted);
}
.tool svg { width: 46px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.tool svg circle { fill: currentColor; }
.tool[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); color: var(--ink); font-weight: 700; }
.tool[aria-pressed="true"] svg { stroke: var(--pen); } .tool[aria-pressed="true"] svg circle { fill: var(--pen); }
.tool:disabled { opacity: .5; cursor: default; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ink); display: inline-block; }
.dot.f { background: var(--ink); }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 12px 6px;
  font: 400 1.3rem/1.2 var(--f-math); cursor: pointer; min-height: 56px; white-space: nowrap; overflow-x: auto;
}
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }

.actions { display: flex; gap: 10px; }
.btn {
  flex: 1; border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer;
  font: 700 1.05rem/1 var(--f-display); background: var(--pen); color: var(--card);
}
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.ghost { flex: 0 0 auto; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--bad); color: var(--card); }

.fb { border-radius: 14px; padding: 14px; display: grid; gap: 10px; border: 1.5px solid; }
.fb.ok { border-color: var(--ok); background: var(--ok-soft); }
.fb.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb.mid { border-color: var(--pen); background: var(--pen-soft); }
.fb-head { font: 800 1.15rem/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; }
.fb.ok .fb-head span:last-child { color: var(--ok); }
.fb.bad .fb-head span:last-child { color: var(--bad); }
.explain { margin: 0; font-size: .95rem; }
.explain .m { font-family: var(--f-math); font-size: 1.12em; white-space: nowrap; }
.fb .axis-wrap { background: var(--card); border-radius: 10px; margin: 0; padding: 2px 6px; cursor: default; }
.fb-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: -6px; }

@media (max-width: 380px) {
  .expr { font-size: 1.6rem; }
  .opt { font-size: 1.12rem; }
}
@media (prefers-reduced-motion: reduce) { .delta { animation-duration: .01s; } }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Number Line<small>step-by-step practice</small></div>
    <div class="score" id="scoreBox"><b id="score">0</b><span>points</span></div>
    <button class="icon-btn" id="setBtn" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="panel" id="settings" hidden>
    <h3>Task types</h3>
    <div class="chips" id="typeChips"></div>
    <p class="small" style="margin:0">A correct answer earns +10 points, a wrong one costs 5 points. When marking a number, “close” earns +5.</p>
    <div class="row">
      <button class="btn ghost" id="resetBtn" type="button">Reset score</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>
  <article class="card" id="card" aria-live="polite"><noscript><p class="hint">This page needs JavaScript. Open it in Chrome or Safari, not in a file preview.</p></noscript><p class="hint">Loading…</p></article>
</main>

<script>
window.addEventListener('error', function (e) {
  var c = document.getElementById('card');
  if (c) c.innerHTML = '<p class="hint">Something went wrong while loading the task: ' + String(e.message).replace(/</g, '&lt;') + '</p>';
});
</script>
<script>
(() => {
  /* ---------- helpers ---------- */
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const coin = (p = 0.5) => Math.random() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const fmt = n => n < 0 ? '−' + (-n) : String(n);
  const fmtDec = (v, d = 2) => {
    const s = String(Math.round(Math.abs(v) * 10 ** d) / 10 ** d);
    return (v < 0 && s !== '0' ? '−' : '') + s;
  };
  const isqrt = n => { let k = 0; while ((k + 1) * (k + 1) <= n) k++; return k; };
  const icbrt = n => { let k = 0; while ((k + 1) ** 3 <= n) k++; return k; };
  const fracH = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const sqrtH = (n, sym = '√') => `<span class="rt">${sym}<span class="rad">${n}</span></span>`;
  const X_ = '<i>x</i>';
  const M = h => `<span class="m">${h}</span>`;

  /* ---------- saved state ---------- */
  const KEY = 'numberLine.v1';
  const TYPES = {
    draw: 'Inequality → line',
    read: 'Line → inequality',
    place: 'Mark the number',
    between: 'Between which integers?'
  };
  let S = { score: 0, best: 0, ok: 0, bad: 0, streak: 0, n: 0, types: { draw: true, read: true, place: true, between: true } };
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) S = { ...S, ...saved, types: { ...S.types, ...(saved.types || {}) } }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- number line (SVG) ---------- */
  const W = 360, H = 86, AY = 56, PL = 18, PR = 28, RISE = 20;
  const X = (v, ax) => PL + (v - ax.min) / (ax.max - ax.min) * (W - PL - PR);

  function axisSVG(ax, layers = '', under = '') {
    let s = `<svg class="axis" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line from ${ax.min} to ${ax.max}">`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>` + under;
    s += `<line class="ax-line" x1="4" y1="${AY}" x2="${W - 5}" y2="${AY}"/>`;
    s += `<path class="ax-arrow" d="M${W - 13},${AY - 5} L${W - 4},${AY} L${W - 13},${AY + 5}"/>`;
    for (let v = ax.min; v <= ax.max; v++) {
      const x = X(v, ax);
      s += `<line class="tick" x1="${x}" y1="${AY - 6}" x2="${x}" y2="${AY + 6}"/>`;
      if (!ax.labels || ax.labels.has(v)) s += `<text class="tlabel${v === 0 ? ' zero' : ''}" x="${x}" y="${AY + 23}">${fmt(v)}</text>`;
    }
    return s + layers + '</svg>';
  }
  const ptSVG = (v, closed, ax, c) => `<circle class="pt ${c} ${closed ? 'closed' : 'open'}" cx="${X(v, ax)}" cy="${AY}" r="6"/>`;
  function intervalSVG(sp, ax, c) {
    const y = AY - RISE;
    const x1 = sp.lo == null ? 4 : X(sp.lo, ax), x2 = sp.hi == null ? W - 10 : X(sp.hi, ax);
    let d = '';
    if (sp.lo != null) d += `M${x1},${AY} V${y} `; else d += `M${x1},${y} `;
    d += `H${x2}`;
    if (sp.hi != null) d += ` V${AY}`;
    let s = `<path class="iv ${c}" d="${d}"/>`;
    if (sp.lo != null) s += ptSVG(sp.lo, sp.loC, ax, c);
    if (sp.hi != null) s += ptSVG(sp.hi, sp.hiC, ax, c);
    return s;
  }
  const pinSVG = (v, ax, c, tall) => {
    const x = X(v, ax), top = AY - (tall ? 34 : 26);
    return `<line class="pinline ${c}" x1="${x}" y1="${top}" x2="${x}" y2="${AY + 7}"/>` +
      `<path class="pin ${c}" d="M${x - 7},${top - 12} L${x + 7},${top - 12} L${x},${top} Z"/>`;
  };
  const segSVG = (n, ax, c) => `<rect class="seg ${c}" x="${X(n, ax)}" y="${AY - 9}" width="${X(n + 1, ax) - X(n, ax)}" height="18" rx="4"/>`;

  /* ---------- intervals / inequalities ---------- */
  // spec: { lo, loC, hi, hiC } — lo = null means −∞, hi = null means +∞
  const key = s => [s.lo, s.lo == null ? '' : s.loC, s.hi, s.hi == null ? '' : s.hiC].join('|');
  function genSpec() {
    const r = Math.random(), a = rint(-8, 8);
    if (r < 0.35) return { lo: a, loC: coin(), hi: null, hiC: false };
    if (r < 0.7) return { lo: null, loC: false, hi: a, hiC: coin() };
    const lo = rint(-8, 5);
    return { lo, loC: coin(), hi: lo + rint(1, 6), hiC: coin() };
  }
  function fitAxis(sp, span) {
    const a = sp.lo != null ? sp.lo : sp.hi, b = sp.hi != null ? sp.hi : sp.lo;
    const room = span - (b - a);
    const min = a - rint(2, Math.max(2, room - 2));
    return { min, max: min + span };
  }
  const le = c => c ? '≤' : '<', ge = c => c ? '≥' : '>';
  function intervalH(s) {
    const L = s.lo == null ? '(−∞' : (s.loC ? '[' : '(') + fmt(s.lo);
    const R = s.hi == null ? '∞)' : fmt(s.hi) + (s.hiC ? ']' : ')');
    return `${X_} ∈ ${L}, ${R}`;
  }
  function ineqH(s, variant = 'std') {
    if (variant === 'int') return intervalH(s);
    if (s.lo != null && s.hi != null) return `${fmt(s.lo)} ${le(s.loC)} ${X_} ${le(s.hiC)} ${fmt(s.hi)}`;
    if (s.lo != null) return variant === 'rev' ? `${fmt(s.lo)} ${le(s.loC)} ${X_}` : `${X_} ${ge(s.loC)} ${fmt(s.lo)}`;
    return variant === 'rev' ? `${fmt(s.hi)} ${ge(s.hiC)} ${X_}` : `${X_} ${le(s.hiC)} ${fmt(s.hi)}`;
  }
  function distractors(s, n) {
    const main = [], shifts = [];
    if (s.lo != null) {
      main.push({ ...s, loC: !s.loC });
      shifts.push({ ...s, lo: s.lo - 1 });
      if (s.hi == null || s.lo + 1 < s.hi) shifts.push({ ...s, lo: s.lo + 1 });
    }
    if (s.hi != null) {
      main.push({ ...s, hiC: !s.hiC });
      shifts.push({ ...s, hi: s.hi + 1 });
      if (s.lo == null || s.hi - 1 > s.lo) shifts.push({ ...s, hi: s.hi - 1 });
    }
    if (s.lo != null && s.hi == null) main.push({ lo: null, loC: false, hi: s.lo, hiC: s.loC }, { lo: null, loC: false, hi: s.lo, hiC: !s.loC });
    if (s.hi != null && s.lo == null) main.push({ lo: s.hi, loC: s.hiC, hi: null, hiC: false }, { lo: s.hi, loC: !s.hiC, hi: null, hiC: false });
    if (s.lo != null && s.hi != null) main.push({ ...s, loC: !s.loC, hiC: !s.hiC }, { lo: s.lo, loC: s.loC, hi: null, hiC: false });
    const seen = new Set([key(s)]), out = [];
    for (const c of [...shuffle(main), ...shuffle(shifts)]) {
      if (out.length >= n) break;
      if (!seen.has(key(c))) { seen.add(key(c)); out.push(c); }
    }
    return out;
  }
  function explainSpec(s, variant) {
    const a = s.lo != null ? fmt(s.lo) : null, b = s.hi != null ? fmt(s.hi) : null;
    let t;
    if (a != null && b == null) t = `We want numbers ${s.loC ? `greater than or equal to ${a}` : `greater than ${a}`}, so we shade to the right of ${a}.`;
    else if (a == null) t = `We want numbers ${s.hiC ? `less than or equal to ${b}` : `less than ${b}`}, so we shade to the left of ${b}.`;
    else t = `We want numbers between ${a} and ${b}.`;
    const end = (v, c) => ` ${fmt(v)} ${c ? 'is included, so the dot is filled (●)' : 'is not included, so the dot is open (○)'}.`;
    if (s.lo != null) t += end(s.lo, s.loC);
    if (s.hi != null) t += end(s.hi, s.hiC);
    t += variant === 'int' ? ` As an inequality: ${M(ineqH(s))}.` : ` In interval notation: ${M(intervalH(s))}.`;
    return t;
  }

  /* ---------- numbers to place ---------- */
  function genPlace() {
    const r = Math.random();
    if (r < 0.25) {
      const v = rint(-5, 5) + pick([0.5, 0.25, 0.75, 0.2, 0.4, 0.6, 0.8]);
      const A = Math.floor(v);
      return { html: fmtDec(v), v, explain: `${M(fmtDec(v))} lies between ${fmt(A)} and ${fmt(A + 1)}.` };
    }
    if (r < 0.55) {
      const q = pick([2, 3, 4, 5]); let p; do { p = rint(q + 1, 5 * q); } while (gcd(p, q) !== 1);
      const neg = coin(0.35), w = Math.floor(p / q), rest = p % q, v = (neg ? -1 : 1) * p / q, sg = neg ? '−' : '';
      return { html: sg + fracH(p, q), v, explain: `${M(sg + fracH(p, q) + ' = ' + sg + w + fracH(rest, q) + ' ≈ ' + fmtDec(v))}.` };
    }
    if (r < 0.8) {
      const q = pick([2, 3, 4, 5]); let rest; do { rest = rint(1, q - 1); } while (gcd(rest, q) !== 1);
      const w = rint(0, 4), neg = coin(0.3), v = (neg ? -1 : 1) * (w + rest / q), sg = neg ? '−' : '';
      const h = sg + (w ? w : '') + fracH(rest, q);
      return { html: h, v, explain: `${M(h + ' ≈ ' + fmtDec(v))}.` };
    }
    let n; do { n = rint(2, 40); } while (isqrt(n) ** 2 === n);
    const k = isqrt(n), v = Math.sqrt(n);
    return { html: sqrtH(n), v, explain: `${M(sqrtH(n) + ' ≈ ' + fmtDec(v))}, since ${M(k + '² = ' + k * k)} and ${M((k + 1) + '² = ' + (k + 1) ** 2)}.` };
  }
  function genBetween() {
    const r = Math.random();
    if (r < 0.32) {
      let n; do { n = rint(2, 150); } while (isqrt(n) ** 2 === n);
      const k = isqrt(n);
      return { html: sqrtH(n), v: Math.sqrt(n), explain: `${M(`${k}² = ${k * k} < ${n} < ${(k + 1) ** 2} = ${k + 1}²`)}, so ${M(`${k} < ${sqrtH(n)} < ${k + 1}`)}.` };
    }
    if (r < 0.47) {
      let n; do { n = rint(2, 90); } while (isqrt(n) ** 2 === n);
      const k = isqrt(n);
      return { html: '−' + sqrtH(n), v: -Math.sqrt(n), explain: `${M(`${k} < ${sqrtH(n)} < ${k + 1}`)}, since ${M(`${k * k} < ${n} < ${(k + 1) ** 2}`)}. Changing the sign flips the inequalities: ${M(`${fmt(-k - 1)} < −${sqrtH(n)} < ${fmt(-k)}`)}.` };
    }
    if (r < 0.57) {
      const a = pick([2, 3, 4, 5]), b = pick([2, 3, 5, 6, 7]), N = a * a * b, k = isqrt(N);
      const h = a + sqrtH(b);
      return { html: h, v: a * Math.sqrt(b), explain: `${M(`${h} = ${sqrtH(a + '²·' + b)} = ${sqrtH(N)}`)}, and ${M(`${k * k} < ${N} < ${(k + 1) ** 2}`)}, so ${M(`${k} < ${h} < ${k + 1}`)}.` };
    }
    if (r < 0.82) {
      const q = rint(2, 9); let p; do { p = rint(q + 1, 11 * q); } while (gcd(p, q) !== 1);
      const w = Math.floor(p / q), rest = p % q, neg = coin(0.3);
      if (!neg) return { html: fracH(p, q), v: p / q, explain: `${M(`${p} ÷ ${q} = ${w}`)} remainder ${rest}, so ${M(fracH(p, q) + ' = ' + w + fracH(rest, q))}, which means ${M(`${w} < ${fracH(p, q)} < ${w + 1}`)}.` };
      return { html: '−' + fracH(p, q), v: -p / q, explain: `${M(fracH(p, q) + ' = ' + w + fracH(rest, q))}, so ${M('−' + fracH(p, q))} lies between ${M(fmt(-w - 1))} and ${M(fmt(-w))}.` };
    }
    if (r < 0.94) {
      let n; do { n = rint(2, 200); } while (icbrt(n) ** 3 === n);
      const k = icbrt(n);
      return { html: sqrtH(n, '∛'), v: Math.cbrt(n), explain: `${M(`${k}³ = ${k ** 3} < ${n} < ${(k + 1) ** 3} = ${k + 1}³`)}, so ${M(`${k} < ${sqrtH(n, '∛')} < ${k + 1}`)}.` };
    }
    return pick([
      { html: 'π', v: Math.PI, explain: `${M('π ≈ 3.14')}, so it lies between 3 and 4.` },
      { html: '2π', v: 2 * Math.PI, explain: `${M('2π ≈ 2 · 3.14 = 6.28')}, so it lies between 6 and 7.` },
      { html: '−π', v: -Math.PI, explain: `${M('π ≈ 3.14')}, so ${M('−π ≈ −3.14')} lies between −4 and −3.` }
    ]);
  }

  /* ---------- tasks ---------- */
  let T = null;
  function newTask() {
    const kinds = Object.keys(TYPES).filter(k => S.types[k]);
    const kind = pick(kinds.length ? kinds : Object.keys(TYPES));
    if (kind === 'draw') {
      const spec = genSpec();
      const ray = spec.lo == null || spec.hi == null;
      const variant = ray ? pick(['std', 'std', 'rev', 'int']) : pick(['std', 'std', 'int']);
      T = { kind, spec, variant, ax: fitAxis(spec, 12), mode: null, pts: [] };
    } else if (kind === 'read') {
      const spec = genSpec();
      const ax = fitAxis(spec, 12);
      ax.labels = new Set([spec.lo, spec.hi, 0, 1].filter(v => v != null));
      const options = shuffle([spec, ...distractors(spec, 3)]);
      T = { kind, spec, variant: pick(['std', 'std', 'int']), ax, options, sel: null };
    } else if (kind === 'place') {
      const num = genPlace();
      const min = Math.floor(num.v) - rint(1, 6);
      T = { kind, num, ax: { min, max: min + 8 }, mark: null };
    } else {
      const num = genBetween();
      const min = Math.floor(num.v) - rint(1, 8);
      T = { kind, num, ax: { min, max: min + 10 }, sel: null };
    }
    T.checked = false;
    renderCard();
  }

  function userSpec() {
    const p = T.pts;
    if (T.mode === 'right' && p.length === 1) return { lo: p[0].v, loC: p[0].c, hi: null, hiC: false };
    if (T.mode === 'left' && p.length === 1) return { lo: null, loC: false, hi: p[0].v, hiC: p[0].c };
    if (T.mode === 'seg' && p.length === 2) {
      const [a, b] = p.slice().sort((x, y) => x.v - y.v);
      return { lo: a.v, loC: a.c, hi: b.v, hiC: b.c };
    }
    return null;
  }
  function canCheck() {
    if (T.kind === 'draw') return !!userSpec();
    if (T.kind === 'read' || T.kind === 'between') return T.sel != null;
    return T.mark != null;
  }
  function whyDisabled() {
    if (T.kind === 'draw') {
      if (!T.mode) return 'Choose which way the set goes.';
      if (T.mode === 'seg' && T.pts.length < 2) return T.pts.length ? 'Place the second point.' : 'Place both endpoints on the line.';
      if (!T.pts.length) return 'Tap a number on the line to place a point.';
    }
    if (T.kind === 'read') return 'Pick one answer.';
    if (T.kind === 'place') return 'Tap the line (you can drag the marker).';
    if (T.kind === 'between') return 'Tap the gap between two integers.';
    return '';
  }

  /* ---------- rendering ---------- */
  const card = document.getElementById('card');

  function axisLayers() {
    const ax = T.ax;
    if (T.kind === 'draw') {
      const sp = userSpec();
      const c = T.checked ? (T.result.ok ? 'c-ok' : 'c-bad') : 'c-pen';
      if (sp) return { layers: intervalSVG(sp, ax, c) };
      return { layers: T.pts.map(p => ptSVG(p.v, p.c, ax, c)).join('') };
    }
    if (T.kind === 'read') return { layers: intervalSVG(T.spec, ax, 'c-pen') };
    if (T.kind === 'place') {
      let l = '';
      if (T.checked) l += pinSVG(T.num.v, ax, 'c-ok', true);
      if (T.mark != null) l += pinSVG(T.mark, ax, T.checked ? (T.result.pts > 0 ? 'c-pen' : 'c-bad') : 'c-pen');
      return { layers: l };
    }
    let under = '';
    if (T.checked) {
      const good = Math.floor(T.num.v);
      if (T.sel !== good) under += segSVG(T.sel, ax, 'c-bad');
      under += segSVG(good, ax, 'c-ok');
    } else if (T.sel != null) under += segSVG(T.sel, ax, 'c-pen');
    return { layers: '', under };
  }
  function renderAxis() {
    const wrap = document.getElementById('axisWrap');
    const { layers, under } = axisLayers();
    wrap.innerHTML = axisSVG(T.ax, layers, under || '');
    wrap.classList.toggle('locked', T.checked || T.kind === 'read');
    const btn = document.getElementById('checkBtn');
    if (btn) btn.disabled = !canCheck();
    const why = document.getElementById('why');
    if (why) why.textContent = canCheck() ? '' : whyDisabled();
  }

  const ICONS = {
    left: '<svg viewBox="0 0 46 18"><path d="M3 6H36V14"/><circle cx="36" cy="14" r="3.4"/></svg>',
    right: '<svg viewBox="0 0 46 18"><path d="M43 6H10V14"/><circle cx="10" cy="14" r="3.4"/></svg>',
    seg: '<svg viewBox="0 0 46 18"><path d="M9 14V6H37V14"/><circle cx="9" cy="14" r="3.4"/><circle cx="37" cy="14" r="3.4"/></svg>'
  };
  const LEGEND = '<div class="legend"><span><i class="dot f"></i>number is included</span><span><i class="dot"></i>number is not included</span></div>';

  function renderCard() {
    const num = S.n + 1;
    let h = `<div class="eyebrow"><b>Task ${num}</b></div>`;
    if (T.kind === 'draw') {
      h += `<h2 class="prompt">${T.variant === 'int' ? 'Show this interval on the number line' : 'Show the solution set of this inequality on the number line'}</h2>`;
      h += `<div class="expr">${ineqH(T.spec, T.variant)}</div>`;
      h += `<div class="tools">` +
        [['left', 'to the left'], ['seg', 'between two numbers'], ['right', 'to the right']].map(([m, l]) =>
          `<button class="tool" type="button" data-mode="${m}" aria-pressed="${T.mode === m}" ${T.checked ? 'disabled' : ''}>${ICONS[m]}${l}</button>`).join('') + `</div>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<p class="hint">Tap a number to place a point. Tap the point again to switch between ● and ○.</p>`;
      h += LEGEND;
    } else if (T.kind === 'read') {
      h += `<h2 class="prompt">Which statement describes the set shown on the number line?</h2>`;
      h += `<div class="axis-wrap locked" id="axisWrap"></div>`;
      h += `<div class="opts">` + T.options.map((o, i) => {
        let cls = '';
        if (T.checked) { if (key(o) === key(T.spec)) cls = 'is-ok'; else if (i === T.sel) cls = 'is-bad'; }
        return `<button class="opt ${cls}" type="button" data-opt="${i}" aria-pressed="${T.sel === i}" ${T.checked ? 'disabled' : ''}>${ineqH(o, T.variant)}</button>`;
      }).join('') + `</div>`;
    } else if (T.kind === 'place') {
      h += `<h2 class="prompt">Mark roughly where this number is on the line</h2>`;
      h += `<div class="expr">${T.num.html}</div>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<p class="hint">Tap the line, then drag the marker to adjust it.</p>`;
    } else {
      h += `<h2 class="prompt">Between which two consecutive integers does this number lie?</h2>`;
      h += `<div class="expr">${T.num.html}</div>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<p class="hint">Tap the gap between two neighbouring integers.</p>`;
    }
    if (!T.checked) {
      h += `<div class="actions">` + (T.kind === 'draw' ? `<button class="btn ghost" type="button" id="clearBtn">Clear</button>` : '') +
        `<button class="btn" type="button" id="checkBtn">Check</button></div><p class="hint" id="why"></p>`;
    } else {
      h += feedbackHTML();
    }
    card.innerHTML = h;
    renderAxis();
    if (T.checked && T.kind === 'draw' && !T.result.ok) {
      document.getElementById('solWrap').innerHTML = axisSVG(T.ax, intervalSVG(T.spec, T.ax, 'c-ok'));
    }
    bindCard();
    renderStats();
  }

  function feedbackHTML() {
    const r = T.result;
    const cls = r.pts >= 10 ? 'ok' : r.pts > 0 ? 'mid' : 'bad';
    const sign = r.pts > 0 ? '+' : '−';
    let h = `<div class="fb ${cls}"><div class="fb-head"><span>${r.title}</span><span>${sign}${Math.abs(r.pts)} pts</span></div>`;
    if (T.kind === 'draw' && !r.ok) h += `<div class="fb-label">Correct drawing</div><div class="axis-wrap locked" id="solWrap"></div>`;
    h += `<p class="explain">${r.explain}</p></div>`;
    h += `<div class="actions"><button class="btn" type="button" id="nextBtn">Next task →</button></div>`;
    return h;
  }

  /* ---------- interaction ---------- */
  function valAt(e) {
    const svg = document.querySelector('#axisWrap svg');
    const r = svg.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W;
    return T.ax.min + (vx - PL) / (W - PL - PR) * (T.ax.max - T.ax.min);
  }
  function tapDraw(raw) {
    const v = Math.max(T.ax.min, Math.min(T.ax.max, Math.round(raw)));
    const i = T.pts.findIndex(p => p.v === v);
    if (i >= 0) {
      const p = T.pts.splice(i, 1)[0]; p.c = !p.c; T.pts.push(p);
    } else {
      const max = T.mode === 'seg' ? 2 : 1;
      if (T.pts.length < max) T.pts.push({ v, c: true });
      else {
        let j = 0;
        if (max === 2) j = Math.abs(T.pts[0].v - v) <= Math.abs(T.pts[1].v - v) ? 0 : 1;
        const old = T.pts.splice(j, 1)[0];
        T.pts.push({ v, c: old.c });
      }
    }
    renderAxis();
  }
  let dragging = false;
  function bindCard() {
    const wrap = document.getElementById('axisWrap');
    if (T.kind !== 'read') {
      wrap.addEventListener('pointerdown', e => {
        if (T.checked) return;
        const v = valAt(e);
        if (T.kind === 'draw') tapDraw(v);
        else if (T.kind === 'between') {
          T.sel = Math.max(T.ax.min, Math.min(T.ax.max - 1, Math.floor(v))); renderAxis();
        } else {
          T.mark = Math.max(T.ax.min - 0.4, Math.min(T.ax.max + 0.4, v)); renderAxis();
          dragging = true;
          try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
        }
      });
      wrap.addEventListener('pointermove', e => {
        if (!dragging || T.checked || T.kind !== 'place') return;
        T.mark = Math.max(T.ax.min - 0.4, Math.min(T.ax.max + 0.4, valAt(e))); renderAxis();
      });
      const stop = () => { dragging = false; };
      wrap.addEventListener('pointerup', stop);
      wrap.addEventListener('pointercancel', stop);
    }
    card.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      T.mode = b.dataset.mode;
      if (T.mode !== 'seg' && T.pts.length > 1) T.pts = [T.pts[T.pts.length - 1]];
      card.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      renderAxis();
    }));
    card.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
      T.sel = +b.dataset.opt;
      card.querySelectorAll('[data-opt]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      renderAxis();
    }));
    const clear = document.getElementById('clearBtn');
    if (clear) clear.addEventListener('click', () => { T.pts = []; renderAxis(); });
    const check = document.getElementById('checkBtn');
    if (check) check.addEventListener('click', doCheck);
    const next = document.getElementById('nextBtn');
    if (next) { next.addEventListener('click', newTask); next.focus({ preventScroll: true }); }
  }

  function doCheck() {
    if (T.checked || !canCheck()) return;
    let res;
    if (T.kind === 'draw') {
      const ok = key(userSpec()) === key(T.spec);
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite', explain: explainSpec(T.spec, T.variant) };
    } else if (T.kind === 'read') {
      const ok = key(T.options[T.sel]) === key(T.spec);
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite', explain: explainSpec(T.spec, T.variant) };
    } else if (T.kind === 'place') {
      const d = Math.abs(T.mark - T.num.v);
      const pts = d <= 0.2 ? 10 : d <= 0.4 ? 5 : -5;
      res = { ok: pts > 0, pts, title: pts === 10 ? 'Spot on!' : pts > 0 ? 'Close!' : 'Too far',
        explain: `${T.num.explain} Your marker: about ${M(fmtDec(T.mark, 1))}, off by ${M(fmtDec(d, 2))}. The green marker shows the exact spot.` };
    } else {
      const good = Math.floor(T.num.v), ok = T.sel === good;
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite',
        explain: `${ok ? '' : `The answer is between ${M(fmt(good))} and ${M(fmt(good + 1))}. `}${T.num.explain}` };
    }
    T.checked = true; T.result = res;
    S.n++; S.score += res.pts;
    if (res.ok) { S.ok++; S.streak++; } else { S.bad++; S.streak = 0; }
    S.best = Math.max(S.best, S.score);
    save();
    floatDelta(res.pts);
    renderCard();
  }

  /* ---------- score and settings ---------- */
  function renderStats() {
    document.getElementById('score').textContent = S.score;
    document.getElementById('stats').innerHTML =
      `<span class="streak">streak <b>${S.streak}</b></span><span>correct <b>${S.ok}</b></span><span>wrong <b>${S.bad}</b></span><span>best <b>${S.best}</b></span>`;
  }
  function floatDelta(p) {
    const el = document.createElement('span');
    el.className = 'delta ' + (p > 0 ? 'up' : 'down');
    el.textContent = (p > 0 ? '+' : '−') + Math.abs(p);
    el.style.right = '100%'; el.style.marginRight = '10px';
    document.getElementById('scoreBox').appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  const setBtn = document.getElementById('setBtn'), settings = document.getElementById('settings');
  setBtn.addEventListener('click', () => {
    settings.hidden = !settings.hidden;
    setBtn.setAttribute('aria-expanded', String(!settings.hidden));
  });
  function renderChips() {
    const box = document.getElementById('typeChips');
    box.innerHTML = Object.entries(TYPES).map(([k, l]) => `<button class="chip" type="button" id="chip-${k}" data-type="${k}" aria-pressed="${!!S.types[k]}">${l}</button>`).join('');
    box.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.type;
      const on = Object.values(S.types).filter(Boolean).length;
      if (S.types[k] && on === 1) return;
      S.types[k] = !S.types[k]; save(); renderChips();
      if (!T.checked && !S.types[T.kind]) newTask();
    }));
  }
  let resetArmed = false;
  const resetBtn = document.getElementById('resetBtn'), resetNote = document.getElementById('resetNote');
  const disarm = () => { resetArmed = false; resetBtn.textContent = 'Reset score'; resetBtn.classList.remove('danger'); resetBtn.classList.add('ghost'); };
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true; resetBtn.textContent = 'Yes, reset'; resetBtn.classList.add('danger'); resetBtn.classList.remove('ghost');
      resetNote.textContent = 'Tap again to confirm.';
      setTimeout(() => { if (resetArmed) { disarm(); resetNote.textContent = ''; } }, 4000);
      return;
    }
    disarm();
    Object.assign(S, { score: 0, best: 0, ok: 0, bad: 0, streak: 0, n: 0 }); save();
    resetNote.textContent = 'Score reset.';
    newTask();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.closest('.chip, #resetBtn, #setBtn')) return;
    if (T.checked) { e.preventDefault(); newTask(); }
    else if (canCheck() && !e.target.closest('button')) { e.preventDefault(); doCheck(); }
  });

  renderChips();
  newTask();
})();
</script>
</body>
</html>
