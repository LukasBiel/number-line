<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Line Walker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: graph-paper notebook — narrow column, sticky score bar, one task card; a walker on the line driven by ◀ ▶ pads */
:root {
  --paper: #f5f7fc;
  --grid: #e1e7f4;
  --card: #ffffff;
  --ink: #17213b;
  --muted: #5b6784;
  --line: #ccd5e8;
  --pen: #2146c4;
  --pen-soft: #e2e8fb;
  --ok: #12804e;
  --ok-soft: #dcf2e6;
  --bad: #c42c38;
  --bad-soft: #fbe2e4;
  --skin: #f2c9a0;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
    --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
    --bad: #ff7b85; --bad-soft: #3b1920; --skin: #d9a77c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
  --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
  --bad: #ff7b85; --bad-soft: #3b1920; --skin: #d9a77c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.5 var(--f-ui);
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
a { color: var(--pen); }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 580px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font: 800 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font: 400 .72rem/1.3 var(--f-ui); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
.score { margin-left: auto; text-align: right; position: relative; }
.score b { font: 800 1.7rem/1 var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.score span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.delta { position: absolute; right: 100%; margin-right: 10px; top: -2px; font: 800 1rem/1 var(--f-display); animation: float 1.1s ease-out forwards; pointer-events: none; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); }
@keyframes float { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; }
.stats { max-width: 580px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 700; }
.stats .streak b { color: var(--pen); }

main { max-width: 580px; margin: 0 auto; padding: 16px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card > *, .panel > * { min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font: 600 1rem/1.2 var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--pen-soft); border-color: var(--pen); color: var(--ink); font-weight: 700; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.small { font-size: .82rem; color: var(--muted); }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 16px; display: grid; gap: 14px;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px color-mix(in srgb, var(--pen) 45%, transparent);
}
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--pen); }
.prompt { margin: 0; font: 600 1.12rem/1.3 var(--f-display); text-wrap: balance; }
.expr { font: 400 1.9rem/1.3 var(--f-math); text-align: center; padding: 2px 0; white-space: nowrap; overflow-x: auto; }
.expr i, .opt i, .explain i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.08; margin: 0 .08em; }
.frac > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
.rt { white-space: nowrap; }
.rad { border-top: .07em solid currentColor; padding: .04em .08em 0; margin-left: -.02em; }
.and { font: 400 .55em var(--f-ui); color: var(--muted); margin: 0 .5em; vertical-align: middle; }

.axis-wrap { user-select: none; -webkit-user-select: none; margin: 0 -6px; }
svg.axis { display: block; width: 100%; height: auto; overflow: visible; }
.ax-line { stroke: var(--ink); stroke-width: 1.6; }
.ax-arrow { stroke: var(--ink); stroke-width: 1.6; fill: none; stroke-linejoin: round; }
.tick { stroke: var(--ink); stroke-width: 1.3; }
.tlabel { fill: var(--muted); font: 12px var(--f-ui); text-anchor: middle; font-variant-numeric: tabular-nums; }
.tlabel.zero { fill: var(--ink); font-weight: 700; }
.iv { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pt { stroke-width: 2.4; }
.c-pen { stroke: var(--pen); } .pt.c-pen.closed { fill: var(--pen); }
.c-ok { stroke: var(--ok); } .pt.c-ok.closed { fill: var(--ok); }
.c-bad { stroke: var(--bad); } .pt.c-bad.closed { fill: var(--bad); }
.pt.open { fill: var(--card); }
.seg { stroke-width: 1.5; }
.seg.c-pen { fill: var(--pen-soft); } .seg.c-ok { fill: var(--ok-soft); } .seg.c-bad { fill: var(--bad-soft); }
.pin.c-ok { fill: var(--ok); }
.pinline { stroke-width: 2; }
.man { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.man .head { fill: var(--skin); }
.man .shirt { stroke: var(--pen); stroke-width: 4; }
.feet { fill: var(--pen); opacity: .35; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; }
.dot.f { background: currentColor; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; min-height: 1.3em; }
.hint.warn { color: var(--bad); }

.pad { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px; gap: 10px; }
.move, .act, .pick {
  border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.move { height: 64px; background: var(--pen-soft); display: grid; place-items: center; }
.move svg { width: 30px; height: 30px; fill: var(--pen); }
.move.held { background: var(--pen); } .move.held svg { fill: var(--card); }
.act { height: 64px; background: var(--pen); color: var(--card); border-color: var(--pen); font: 700 1.05rem/1.1 var(--f-display); padding: 0 8px; }
.act:disabled, .move:disabled { opacity: .45; cursor: default; }
.picks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pick { background: transparent; padding: 10px 6px; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); color: var(--ink); font-weight: 700; }
.pick:disabled { opacity: .45; cursor: default; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 12px 6px; font: 400 1.3rem/1.2 var(--f-math); cursor: pointer; min-height: 56px; white-space: nowrap; overflow-x: auto; }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }

.actions { display: flex; gap: 10px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer; font: 700 1.05rem/1 var(--f-display); background: var(--pen); color: var(--card); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.ghost { flex: 0 0 auto; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--bad); color: var(--card); }

.fb { border-radius: 14px; padding: 14px; display: grid; gap: 10px; border: 1.5px solid; }
.fb.ok { border-color: var(--ok); background: var(--ok-soft); }
.fb.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb.mid { border-color: var(--pen); background: var(--pen-soft); }
.fb-head { font: 800 1.15rem/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; }
.fb.ok .fb-head span:last-child { color: var(--ok); }
.fb.bad .fb-head span:last-child { color: var(--bad); }
.explain { margin: 0; font-size: .95rem; }
.explain .m { font-family: var(--f-math); font-size: 1.12em; white-space: nowrap; }
.fb .axis-wrap { background: var(--card); border-radius: 10px; margin: 0; padding: 2px 6px; }
.fb-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: -6px; }

@media (max-width: 380px) {
  .expr { font-size: 1.6rem; }
  .opt { font-size: 1.12rem; }
  .pad { grid-template-columns: 64px minmax(0, 1fr) 64px; }
}
@media (prefers-reduced-motion: reduce) { .delta { animation-duration: .01s; } }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">Number Line Walker<small><a href="games.html">← all games</a></small></div>
    <div class="score" id="scoreBox"><b id="score">0</b><span>points</span></div>
    <button class="icon-btn" id="setBtn" aria-label="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
    </button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="panel" id="settings" hidden>
    <h3>Task types</h3>
    <div class="chips" id="typeChips"></div>
    <p class="small" style="margin:0">A correct answer earns +10 points, a wrong one costs 5 points. When marking a number, “close” earns +5. On a keyboard: ← → to walk, Space to place a dot, Enter to check.</p>
    <div class="row">
      <button class="btn ghost" id="resetBtn" type="button">Reset score</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>
  <article class="card" id="card" aria-live="polite"><noscript><p class="hint">This page needs JavaScript. Open it in Chrome or Safari, not in a file preview.</p></noscript><p class="hint">Loading…</p></article>
</main>

<script>
window.addEventListener('error', function (e) {
  var c = document.getElementById('card');
  if (c) c.innerHTML = '<p class="hint">Something went wrong while loading the task: ' + String(e.message).replace(/</g, '&lt;') + '</p>';
});
</script>
<script>
(() => {
  /* ---------- helpers ---------- */
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const coin = (p = 0.5) => Math.random() < p;
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = n => n < 0 ? '−' + (-n) : String(n);
  const fmtDec = (v, d = 2) => {
    const s = String(Math.round(Math.abs(v) * 10 ** d) / 10 ** d);
    return (v < 0 && s !== '0' ? '−' : '') + s;
  };
  const isqrt = n => { let k = 0; while ((k + 1) * (k + 1) <= n) k++; return k; };
  const icbrt = n => { let k = 0; while ((k + 1) ** 3 <= n) k++; return k; };
  const fracH = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const sqrtH = (n, sym = '√') => `<span class="rt">${sym}<span class="rad">${n}</span></span>`;
  const X_ = '<i>x</i>';
  const M = h => `<span class="m">${h}</span>`;

  /* ---------- saved state ---------- */
  const KEY = 'numberLineWalker.v1';
  const TYPES = { draw: 'Inequality → line', read: 'Line → inequality', place: 'Mark the number', between: 'Between which integers?' };
  let S = { score: 0, best: 0, ok: 0, bad: 0, streak: 0, n: 0, types: { draw: true, read: true, place: true, between: true } };
  try { const saved = JSON.parse(localStorage.getItem(KEY)); if (saved) S = { ...S, ...saved, types: { ...S.types, ...(saved.types || {}) } }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- number line (SVG) ---------- */
  const W = 360, H = 104, AY = 72, PL = 18, PR = 28, RISE = 24;
  const X = (v, ax) => PL + (v - ax.min) / (ax.max - ax.min) * (W - PL - PR);

  function axisSVG(ax, layers = '', under = '') {
    let s = `<svg class="axis" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line from ${ax.min} to ${ax.max}">` + under;
    s += `<line class="ax-line" x1="4" y1="${AY}" x2="${W - 5}" y2="${AY}"/>`;
    s += `<path class="ax-arrow" d="M${W - 13},${AY - 5} L${W - 4},${AY} L${W - 13},${AY + 5}"/>`;
    for (let v = ax.min; v <= ax.max; v++) {
      const x = X(v, ax);
      s += `<line class="tick" x1="${x}" y1="${AY - 6}" x2="${x}" y2="${AY + 6}"/>`;
      if (!ax.labels || ax.labels.has(v)) s += `<text class="tlabel${v === 0 ? ' zero' : ''}" x="${x}" y="${AY + 23}">${fmt(v)}</text>`;
    }
    return s + layers + '</svg>';
  }
  const ptSVG = (v, closed, ax, c) => `<circle class="pt ${c} ${closed ? 'closed' : 'open'}" cx="${X(v, ax)}" cy="${AY}" r="6"/>`;
  // classic drawing: a ray runs to the edge of the line
  function intervalSVG(sp, ax, c) {
    const y = AY - RISE;
    const x1 = sp.lo == null ? 4 : X(sp.lo, ax), x2 = sp.hi == null ? W - 10 : X(sp.hi, ax);
    let d = sp.lo != null ? `M${x1},${AY} V${y} ` : `M${x1},${y} `;
    d += `H${x2}`;
    if (sp.hi != null) d += ` V${AY}`;
    let s = `<path class="iv ${c}" d="${d}"/>`;
    if (sp.lo != null) s += ptSVG(sp.lo, sp.loC, ax, c);
    if (sp.hi != null) s += ptSVG(sp.hi, sp.hiC, ax, c);
    return s;
  }
  // rope from a dot up to the walker's hand
  const ropeSVG = (v, handX, ax, c) => `<path class="iv ${c}" d="M${X(v, ax)},${AY} V${AY - RISE} H${handX}"/>`;
  const pinSVG = (v, ax, c) => {
    const x = X(v, ax), top = AY - 58;
    return `<line class="pinline ${c}" x1="${x}" y1="${top}" x2="${x}" y2="${AY + 7}"/><path class="pin ${c}" d="M${x - 7},${top - 12} L${x + 7},${top - 12} L${x},${top} Z"/>`;
  };
  const segSVG = (n, ax, c) => `<rect class="seg ${c}" x="${X(n, ax)}" y="${AY - 9}" width="${X(n + 1, ax) - X(n, ax)}" height="18" rx="4"/>`;

  /* the walker: feet on the line at x; hand = absolute x of the hand holding the rope, or null */
  function manSVG(x, o) {
    const f = o.facing || 1, walk = o.moving ? Math.sin(o.phase) : 0;
    const leg = o.moving ? walk * 7 : 4.5;
    let s = `<g class="man" transform="translate(${x.toFixed(2)},${AY})">`;
    s += `<ellipse class="feet" cx="0" cy="0" rx="9" ry="2.5" stroke="none"/>`;
    s += `<path d="M0,-22 L${leg.toFixed(2)},-1 M0,-22 L${(-leg).toFixed(2)},-1"/>`;
    s += `<path class="shirt" d="M0,-37 L0,-22"/>`;
    if (o.hand != null) {
      const hx = o.hand - x;
      s += `<path d="M0,-35 L${(hx * 0.55).toFixed(2)},-29 L${hx.toFixed(2)},-${RISE}"/>`;
      s += `<path d="M0,-35 L${(-hx * 0.5).toFixed(2)},-27"/>`;
    } else {
      const sw = o.moving ? walk * 5 : 0;
      s += `<path d="M0,-35 L${(-6 + sw).toFixed(2)},-24 M0,-35 L${(6 - sw).toFixed(2)},-24"/>`;
    }
    s += `<circle class="head" cx="${(f * 0.8).toFixed(1)}" cy="-44" r="6.5"/>`;
    s += `<circle cx="${(f * 3.2).toFixed(1)}" cy="-45" r="0.9" fill="currentColor" stroke="none" style="color:var(--ink)"/>`;
    return s + '</g>';
  }

  /* ---------- intervals / inequalities ---------- */
  const key = s => [s.lo, s.lo == null ? '' : s.loC, s.hi, s.hi == null ? '' : s.hiC].join('|');
  function genSpec() {
    const r = Math.random(), a = rint(-8, 8);
    if (r < 0.35) return { lo: a, loC: coin(), hi: null, hiC: false };
    if (r < 0.7) return { lo: null, loC: false, hi: a, hiC: coin() };
    const lo = rint(-8, 5);
    return { lo, loC: coin(), hi: lo + rint(1, 6), hiC: coin() };
  }
  function fitAxis(sp, span) {
    const a = sp.lo != null ? sp.lo : sp.hi, b = sp.hi != null ? sp.hi : sp.lo;
    const room = span - (b - a);
    const min = a - rint(2, Math.max(2, room - 2));
    return { min, max: min + span };
  }
  const le = c => c ? '≤' : '<', ge = c => c ? '≥' : '>';
  function intervalH(s) {
    const L = s.lo == null ? '(−∞' : (s.loC ? '[' : '(') + fmt(s.lo);
    const R = s.hi == null ? '∞)' : fmt(s.hi) + (s.hiC ? ']' : ')');
    return `${X_} ∈ ${L}, ${R}`;
  }
  function ineqH(s, variant = 'std') {
    if (variant === 'int') return intervalH(s);
    if (s.lo != null && s.hi != null) return `${fmt(s.lo)} ${le(s.loC)} ${X_} ${le(s.hiC)} ${fmt(s.hi)}`;
    if (s.lo != null) return variant === 'rev' ? `${fmt(s.lo)} ${le(s.loC)} ${X_}` : `${X_} ${ge(s.loC)} ${fmt(s.lo)}`;
    return variant === 'rev' ? `${fmt(s.hi)} ${ge(s.hiC)} ${X_}` : `${X_} ${le(s.hiC)} ${fmt(s.hi)}`;
  }
  function distractors(s, n) {
    const main = [], shifts = [];
    if (s.lo != null) {
      main.push({ ...s, loC: !s.loC });
      shifts.push({ ...s, lo: s.lo - 1 });
      if (s.hi == null || s.lo + 1 < s.hi) shifts.push({ ...s, lo: s.lo + 1 });
    }
    if (s.hi != null) {
      main.push({ ...s, hiC: !s.hiC });
      shifts.push({ ...s, hi: s.hi + 1 });
      if (s.lo == null || s.hi - 1 > s.lo) shifts.push({ ...s, hi: s.hi - 1 });
    }
    if (s.lo != null && s.hi == null) main.push({ lo: null, loC: false, hi: s.lo, hiC: s.loC }, { lo: null, loC: false, hi: s.lo, hiC: !s.loC });
    if (s.hi != null && s.lo == null) main.push({ lo: s.hi, loC: s.hiC, hi: null, hiC: false }, { lo: s.hi, loC: !s.hiC, hi: null, hiC: false });
    if (s.lo != null && s.hi != null) main.push({ ...s, loC: !s.loC, hiC: !s.hiC }, { lo: s.lo, loC: s.loC, hi: null, hiC: false });
    const seen = new Set([key(s)]), out = [];
    for (const c of [...shuffle(main), ...shuffle(shifts)]) {
      if (out.length >= n) break;
      if (!seen.has(key(c))) { seen.add(key(c)); out.push(c); }
    }
    return out;
  }
  function explainSpec(s, variant) {
    const a = s.lo != null ? fmt(s.lo) : null, b = s.hi != null ? fmt(s.hi) : null;
    let t;
    if (a != null && b == null) t = `We want numbers ${s.loC ? `greater than or equal to ${a}` : `greater than ${a}`}, so the rope goes to the right of ${a}.`;
    else if (a == null) t = `We want numbers ${s.hiC ? `less than or equal to ${b}` : `less than ${b}`}, so the rope goes to the left of ${b}.`;
    else t = `We want numbers between ${a} and ${b}, so the rope is tied between two dots.`;
    const end = (v, c) => ` ${fmt(v)} ${c ? 'is included, so the dot is filled (●)' : 'is not included, so the dot is open (○)'}.`;
    if (s.lo != null) t += end(s.lo, s.loC);
    if (s.hi != null) t += end(s.hi, s.hiC);
    t += variant === 'int' ? ` As an inequality: ${M(ineqH(s))}.` : ` In interval notation: ${M(intervalH(s))}.`;
    return t;
  }

  /* ---------- numbers ---------- */
  function genPlace() {
    const r = Math.random();
    if (r < 0.25) {
      const v = rint(-5, 5) + pick([0.5, 0.25, 0.75, 0.2, 0.4, 0.6, 0.8]);
      const A = Math.floor(v);
      return { html: fmtDec(v), v, explain: `${M(fmtDec(v))} lies between ${fmt(A)} and ${fmt(A + 1)}.` };
    }
    if (r < 0.55) {
      const q = pick([2, 3, 4, 5]); let p; do { p = rint(q + 1, 5 * q); } while (gcd(p, q) !== 1);
      const neg = coin(0.35), w = Math.floor(p / q), rest = p % q, v = (neg ? -1 : 1) * p / q, sg = neg ? '−' : '';
      return { html: sg + fracH(p, q), v, explain: `${M(sg + fracH(p, q) + ' = ' + sg + w + fracH(rest, q) + ' ≈ ' + fmtDec(v))}.` };
    }
    if (r < 0.8) {
      const q = pick([2, 3, 4, 5]); let rest; do { rest = rint(1, q - 1); } while (gcd(rest, q) !== 1);
      const w = rint(0, 4), neg = coin(0.3), v = (neg ? -1 : 1) * (w + rest / q), sg = neg ? '−' : '';
      const h = sg + (w ? w : '') + fracH(rest, q);
      return { html: h, v, explain: `${M(h + ' ≈ ' + fmtDec(v))}.` };
    }
    let n; do { n = rint(2, 40); } while (isqrt(n) ** 2 === n);
    const k = isqrt(n), v = Math.sqrt(n);
    return { html: sqrtH(n), v, explain: `${M(sqrtH(n) + ' ≈ ' + fmtDec(v))}, since ${M(k + '² = ' + k * k)} and ${M((k + 1) + '² = ' + (k + 1) ** 2)}.` };
  }
  /* task mix: weights per task type (only enabled types take part) */
  const WEIGHTS = { draw: 20, read: 20, place: 35, between: 25 };
  function pickKind(kinds) {
    let r = Math.random() * kinds.reduce((s, k) => s + WEIGHTS[k], 0);
    for (const k of kinds) { r -= WEIGHTS[k]; if (r < 0) return k; }
    return kinds[kinds.length - 1];
  }
  const fracVal = (n, d) => {
    const g = gcd(n, d); n /= g; d /= g;
    return d === 1 ? fmt(n) : (n < 0 ? '−' : '') + fracH(Math.abs(n), d);
  };
  const paren = n => n < 0 ? `(${fmt(n)})` : fmt(n);
  // "Mark the number": half classic numbers, half calculations
  function genPlaceAll() {
    const r = Math.random();
    if (r < 0.5) return genPlace();
    if (r < 0.65) {
      const d = rint(3, 7), a = rint(-7, 7 - d), b = a + d, v = (a + b) / 2, min = a - rint(0, 8 - d);
      return { mid: true, html: `${fmt(a)}<span class="and">and</span>${fmt(b)}`, v, ax: { min, max: min + 8 },
        explain: `The midpoint is the average of the two numbers: ${M(`(${fmt(a)} + ${paren(b)}) ÷ 2 = ${fmt(a + b)} ÷ 2 = ${fmtDec(v)}`)}.` };
    }
    if (r < 0.77) {
      let n; do { n = rint(2, 30); } while (isqrt(n) ** 2 === n);
      let k; do { k = rint(-4, 4); } while (!k);
      const plus = coin(0.6), s = Math.sqrt(n), v = plus ? k + s : k - s;
      const h = `${fmt(k)} ${plus ? '+' : '−'} ${sqrtH(n)}`;
      return { html: h, v, explain: `${M(sqrtH(n) + ' ≈ ' + fmtDec(s))}, so ${M(`${h} ≈ ${fmt(k)} ${plus ? '+' : '−'} ${fmtDec(s)} = ${fmtDec(v)}`)}.` };
    }
    if (r < 0.9) {
      const b = pick([2, 3, 4, 5, 6]), d = pick([2, 3, 4, 5, 6].filter(x => x !== b));
      let a, c; do { a = rint(1, 2 * b - 1); } while (a % b === 0); do { c = rint(1, 2 * d - 1); } while (c % d === 0);
      const plus = coin(0.55), L = b * d / gcd(b, d), A = a * L / b, C = c * L / d, N = plus ? A + C : A - C;
      const op = plus ? '+' : '−', h = `${fracH(a, b)} ${op} ${fracH(c, d)}`;
      let ex = `${h} = ${fracH(A, L)} ${op} ${fracH(C, L)} = ${N === 0 ? '0' : (N < 0 ? '−' : '') + fracH(Math.abs(N), L)}`;
      if (N !== 0 && gcd(N, L) > 1) ex += ` = ${fracVal(N, L)}`;
      if (N % L !== 0) ex += ` ≈ ${fmtDec(N / L)}`;
      return { html: h, v: N / L, explain: `Use a common denominator: ${M(ex)}.` };
    }
    const p = pick([10, 20, 25, 30, 40, 50, 60, 75, 150]);
    const base = p > 100 ? rint(2, 8) : rint(2, 20), v = p * base / 100;
    return { html: `${p}% <span class="and">of</span>${base}`, v,
      explain: `${M(`${p}% = ${fmtDec(p / 100)}`)}, so ${M(`${p}% of ${base} = ${fmtDec(p / 100)} · ${base} = ${fmtDec(v)}`)}.` };
  }

  function genBetween() {
    const r = Math.random();
    if (r < 0.32) {
      let n; do { n = rint(2, 150); } while (isqrt(n) ** 2 === n);
      const k = isqrt(n);
      return { html: sqrtH(n), v: Math.sqrt(n), explain: `${M(`${k}² = ${k * k} < ${n} < ${(k + 1) ** 2} = ${k + 1}²`)}, so ${M(`${k} < ${sqrtH(n)} < ${k + 1}`)}.` };
    }
    if (r < 0.47) {
      let n; do { n = rint(2, 90); } while (isqrt(n) ** 2 === n);
      const k = isqrt(n);
      return { html: '−' + sqrtH(n), v: -Math.sqrt(n), explain: `${M(`${k} < ${sqrtH(n)} < ${k + 1}`)}, since ${M(`${k * k} < ${n} < ${(k + 1) ** 2}`)}. Changing the sign flips the inequalities: ${M(`${fmt(-k - 1)} < −${sqrtH(n)} < ${fmt(-k)}`)}.` };
    }
    if (r < 0.57) {
      const a = pick([2, 3, 4, 5]), b = pick([2, 3, 5, 6, 7]), N = a * a * b, k = isqrt(N);
      const h = a + sqrtH(b);
      return { html: h, v: a * Math.sqrt(b), explain: `${M(`${h} = ${sqrtH(a + '²·' + b)} = ${sqrtH(N)}`)}, and ${M(`${k * k} < ${N} < ${(k + 1) ** 2}`)}, so ${M(`${k} < ${h} < ${k + 1}`)}.` };
    }
    if (r < 0.82) {
      const q = rint(2, 9); let p; do { p = rint(q + 1, 11 * q); } while (gcd(p, q) !== 1);
      const w = Math.floor(p / q), rest = p % q, neg = coin(0.3);
      if (!neg) return { html: fracH(p, q), v: p / q, explain: `${M(`${p} ÷ ${q} = ${w}`)} remainder ${rest}, so ${M(fracH(p, q) + ' = ' + w + fracH(rest, q))}, which means ${M(`${w} < ${fracH(p, q)} < ${w + 1}`)}.` };
      return { html: '−' + fracH(p, q), v: -p / q, explain: `${M(fracH(p, q) + ' = ' + w + fracH(rest, q))}, so ${M('−' + fracH(p, q))} lies between ${M(fmt(-w - 1))} and ${M(fmt(-w))}.` };
    }
    if (r < 0.94) {
      let n; do { n = rint(2, 200); } while (icbrt(n) ** 3 === n);
      const k = icbrt(n);
      return { html: sqrtH(n, '∛'), v: Math.cbrt(n), explain: `${M(`${k}³ = ${k ** 3} < ${n} < ${(k + 1) ** 3} = ${k + 1}³`)}, so ${M(`${k} < ${sqrtH(n, '∛')} < ${k + 1}`)}.` };
    }
    return pick([
      { html: 'π', v: Math.PI, explain: `${M('π ≈ 3.14')}, so it lies between 3 and 4.` },
      { html: '2π', v: 2 * Math.PI, explain: `${M('2π ≈ 2 · 3.14 = 6.28')}, so it lies between 6 and 7.` },
      { html: '−π', v: -Math.PI, explain: `${M('π ≈ 3.14')}, so ${M('−π ≈ −3.14')} lies between −4 and −3.` }
    ]);
  }

  /* ---------- walker state ---------- */
  // G.pos = drawn position, G.target = where the walker is heading (the answer uses target)
  const G = { pos: 0, target: 0, facing: 1, moving: false, phase: 0 };
  const STEP = { draw: 1, between: 1, place: 0.1 };
  function limits() {
    const ax = T.ax;
    return T.kind === 'between' ? [ax.min + 0.5, ax.max - 0.5] : [ax.min, ax.max];
  }
  const snap = v => T.kind === 'place' ? Math.round(v * 100) / 100 : T.kind === 'between' ? Math.round(v * 2) / 2 : Math.round(v);
  function setTarget(v) {
    const [a, b] = limits();
    const nv = clamp(snap(v), a, b);
    if (nv !== G.target) { G.facing = nv > G.target ? 1 : -1; G.target = nv; }
    kick();
  }
  const stepOnce = dir => { if (!T.checked && T.kind !== 'read') setTarget(G.target + dir * STEP[T.kind]); };

  let raf = null, last = 0;
  const hold = { timer: null, iv: null, cont: false, dir: 0 };
  function tick(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
    last = t;
    if (hold.cont) {
      const [a, b] = limits();
      G.target = clamp(Math.round((G.target + hold.dir * 1.6 * dt) * 1000) / 1000, a, b);
      G.facing = hold.dir;
    }
    const d = G.target - G.pos, sp = 7 * dt;
    if (Math.abs(d) > 1e-4) {
      G.pos += Math.abs(d) <= sp ? d : Math.sign(d) * sp;
      G.moving = true; G.phase += dt * 15;
    } else { G.pos = G.target; G.moving = hold.cont; if (hold.cont) G.phase += dt * 15; }
    renderAxis();
    if (G.moving || hold.cont) raf = requestAnimationFrame(tick);
    else { raf = null; last = 0; if (T.kind === 'place') G.target = snap(G.target); renderAxis(); }
  }
  function kick() { if (!raf) { last = 0; raf = requestAnimationFrame(tick); } }
  function releaseHold() {
    clearTimeout(hold.timer); clearInterval(hold.iv);
    hold.cont = false;
    document.querySelectorAll('.move.held').forEach(b => b.classList.remove('held'));
    kick();
  }

  /* ---------- tasks ---------- */
  let T = null;
  function startAt(cands, bad) {
    const ok = cands.filter(c => !bad(c));
    return pick(ok.length ? ok : cands);
  }
  function newTask() {
    releaseHold();
    const kinds = Object.keys(TYPES).filter(k => S.types[k]);
    const kind = pickKind(kinds.length ? kinds : Object.keys(TYPES));
    if (kind === 'draw') {
      const spec = genSpec();
      const ray = spec.lo == null || spec.hi == null;
      const variant = ray ? pick(['std', 'std', 'rev', 'int']) : pick(['std', 'std', 'int']);
      T = { kind, spec, variant, ax: fitAxis(spec, 12), dots: [], dotClosed: true };
      const ends = [spec.lo, spec.hi].filter(v => v != null);
      const c = []; for (let v = T.ax.min + 1; v < T.ax.max; v++) c.push(v);
      G.target = startAt(c, v => ends.some(e => Math.abs(e - v) < 2));
    } else if (kind === 'read') {
      const spec = genSpec();
      const ax = fitAxis(spec, 12);
      ax.labels = new Set([spec.lo, spec.hi, 0, 1].filter(v => v != null));
      T = { kind, spec, variant: pick(['std', 'std', 'int']), ax, options: shuffle([spec, ...distractors(spec, 3)]), sel: null };
      T.scene = sceneFor(spec, ax);
    } else if (kind === 'place') {
      const num = genPlaceAll();
      const min = Math.floor(num.v) - rint(1, 6);
      T = { kind, num, ax: num.ax || { min, max: min + 8 } };
      const c = []; for (let v = T.ax.min + 1; v < T.ax.max; v++) c.push(v);
      G.target = startAt(c, v => Math.abs(v - num.v) < 1.5);
    } else {
      const num = genBetween();
      const min = Math.floor(num.v) - rint(1, 8);
      T = { kind, num, ax: { min, max: min + 10 } };
      const c = []; for (let v = min; v < min + 10; v++) c.push(v + 0.5);
      G.target = startAt(c, v => Math.floor(v) === Math.floor(num.v));
    }
    G.pos = G.target; G.facing = 1; G.moving = false;
    T.checked = false;
    renderCard();
  }

  // how the walker shows a given set: a ray is a rope held by the walker, a segment is tied between two dots
  function sceneFor(sp, ax) {
    if (sp.lo != null && sp.hi != null) {
      const side = sp.hi + 2 <= ax.max ? sp.hi + 2 : sp.lo - 2;
      return { manAt: side, hand: null, facing: side > sp.hi ? -1 : 1 };
    }
    const dot = sp.lo != null ? sp.lo : sp.hi, dir = sp.lo != null ? 1 : -1;
    const room = dir > 0 ? ax.max - dot : dot - ax.min;
    const manAt = dot + dir * Math.max(1, Math.min(4, room - 0.5));
    return { manAt, dot, dir, facing: dir };
  }
  function sceneSVG(sp, ax, c) {
    const sc = sceneFor(sp, ax);
    if (sp.lo != null && sp.hi != null) return intervalSVG(sp, ax, c) + manSVG(X(sc.manAt, ax), { facing: sc.facing });
    const hand = X(sc.manAt, ax) - sc.dir * 6;
    const closed = sp.lo != null ? sp.loC : sp.hiC;
    return ropeSVG(sc.dot, hand, ax, c) + ptSVG(sc.dot, closed, ax, c) + manSVG(X(sc.manAt, ax), { facing: sc.facing, hand });
  }

  function userSpec() {
    const d = T.dots;
    if (d.length === 2) {
      const [a, b] = d.slice().sort((x, y) => x.v - y.v);
      return { lo: a.v, loC: a.c, hi: b.v, hiC: b.c };
    }
    if (d.length === 1 && G.target !== d[0].v) {
      return G.target > d[0].v ? { lo: d[0].v, loC: d[0].c, hi: null, hiC: false } : { lo: null, loC: false, hi: d[0].v, hiC: d[0].c };
    }
    return null;
  }
  function canCheck() {
    if (T.kind === 'draw') return !!userSpec();
    if (T.kind === 'read') return T.sel != null;
    return true;
  }
  function hintText() {
    if (T.kind === 'draw') {
      if (!T.dots.length) return 'Walk to a number, choose ● or ○ and tap “Place dot”.';
      if (T.dots.length === 1) return userSpec() ? 'Keep holding the rope this way, or place a second dot here.' : 'Walk left or right to pull the rope.';
      return 'Both dots are placed. Check, or use Undo to change something.';
    }
    if (T.kind === 'read') return T.sel == null ? 'Pick one answer.' : '';
    if (T.kind === 'place') return 'Walk to the spot where the number is, then check. Hold an arrow to walk faster.';
    return 'Stand in the gap between the two integers, then check.';
  }
  let warnTimer = null;
  function warn(msg) {
    const h = document.getElementById('why');
    if (!h) return;
    h.textContent = msg; h.classList.add('warn');
    clearTimeout(warnTimer);
    warnTimer = setTimeout(() => { h.classList.remove('warn'); h.textContent = hintText(); }, 2200);
  }

  /* ---------- rendering ---------- */
  const card = document.getElementById('card');

  function scene() {
    const ax = T.ax, x = X(G.pos, ax);
    const man = o => manSVG(x, Object.assign({ facing: G.facing, moving: G.moving, phase: G.phase }, o));
    if (T.kind === 'read') return { layers: sceneSVG(T.spec, ax, 'c-pen') };
    if (T.kind === 'draw') {
      const c = T.checked ? (T.result.ok ? 'c-ok' : 'c-bad') : 'c-pen';
      const d = T.dots;
      let l = '';
      if (d.length === 2) {
        l += intervalSVG(userSpec(), ax, c) + man({});
      } else if (d.length === 1 && Math.abs(G.pos - d[0].v) > 0.02) {
        const dir = G.pos > d[0].v ? 1 : -1;
        const hand = x - dir * 6;
        l += ropeSVG(d[0].v, hand, ax, c) + ptSVG(d[0].v, d[0].c, ax, c) + man({ hand, facing: G.moving ? G.facing : dir });
      } else {
        l += d.map(p => ptSVG(p.v, p.c, ax, c)).join('') + man({});
      }
      return { layers: l };
    }
    if (T.kind === 'place') {
      let l = man({});
      if (T.checked) l += pinSVG(T.num.v, ax, 'c-ok');
      return { layers: l };
    }
    const cur = Math.floor(G.target);
    let under = '';
    if (T.checked) {
      const good = Math.floor(T.num.v);
      if (cur !== good) under += segSVG(cur, ax, 'c-bad');
      under += segSVG(good, ax, 'c-ok');
    } else under += segSVG(cur, ax, 'c-pen');
    return { layers: man({}), under };
  }
  function renderAxis() {
    const wrap = document.getElementById('axisWrap');
    if (!wrap) return;
    const { layers, under } = scene();
    wrap.innerHTML = axisSVG(T.ax, layers, under || '');
    if (T.checked) return;
    const btn = document.getElementById('checkBtn');
    if (btn) btn.disabled = !canCheck();
    const pb = document.getElementById('placeBtn');
    if (pb) pb.disabled = T.dots.length >= 2;
    const why = document.getElementById('why');
    if (why && !why.classList.contains('warn')) why.textContent = hintText();
  }

  const ARROW_L = '<svg viewBox="0 0 24 24"><path d="M15.5 4 6.5 12l9 8z"/></svg>';
  const ARROW_R = '<svg viewBox="0 0 24 24"><path d="M8.5 4l9 8-9 8z"/></svg>';
  const LEGEND = '<div class="legend"><span><i class="dot f"></i>number is included</span><span><i class="dot"></i>number is not included</span></div>';

  function renderCard() {
    let h = `<div class="eyebrow"><b>Task ${S.n + 1}</b></div>`;
    const dis = T.checked ? 'disabled' : '';
    if (T.kind === 'draw') {
      h += `<h2 class="prompt">${T.variant === 'int' ? 'Show this interval on the number line' : 'Show the solution set of this inequality on the number line'}</h2>`;
      h += `<div class="expr">${ineqH(T.spec, T.variant)}</div>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<div class="picks">
        <button class="pick" type="button" id="pickClosed" aria-pressed="${T.dotClosed}" ${dis}><i class="dot f"></i>filled</button>
        <button class="pick" type="button" id="pickOpen" aria-pressed="${!T.dotClosed}" ${dis}><i class="dot"></i>open</button>
        <button class="pick" type="button" id="undoBtn" ${dis}>Undo</button>
      </div>`;
      h += `<div class="pad">
        <button class="move" type="button" data-dir="-1" aria-label="Walk left" ${dis}>${ARROW_L}</button>
        <button class="act" type="button" id="placeBtn" ${dis}>Place dot</button>
        <button class="move" type="button" data-dir="1" aria-label="Walk right" ${dis}>${ARROW_R}</button>
      </div>`;
    } else if (T.kind === 'read') {
      h += `<h2 class="prompt">Which statement describes the set shown on the number line?</h2>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<div class="opts">` + T.options.map((o, i) => {
        let cls = '';
        if (T.checked) { if (key(o) === key(T.spec)) cls = 'is-ok'; else if (i === T.sel) cls = 'is-bad'; }
        return `<button class="opt ${cls}" type="button" data-opt="${i}" aria-pressed="${T.sel === i}" ${dis}>${ineqH(o, T.variant)}</button>`;
      }).join('') + `</div>`;
    } else {
      h += `<h2 class="prompt">${T.kind === 'place' ? (T.num.mid ? 'Walk to the midpoint between these two numbers' : 'Walk to roughly where this number is on the line') : 'Walk into the gap between the two consecutive integers this number lies between'}</h2>`;
      h += `<div class="expr">${T.num.html}</div>`;
      h += `<div class="axis-wrap" id="axisWrap"></div>`;
      h += `<div class="pad">
        <button class="move" type="button" data-dir="-1" aria-label="Walk left" ${dis}>${ARROW_L}</button>
        ${T.checked ? '<span></span>' : '<button class="act" type="button" id="checkBtn">Check</button>'}
        <button class="move" type="button" data-dir="1" aria-label="Walk right" ${dis}>${ARROW_R}</button>
      </div>`;
    }
    if (!T.checked) {
      if (T.kind === 'draw' || T.kind === 'read') h += `<div class="actions"><button class="btn" type="button" id="checkBtn">Check</button></div>`;
      h += `<p class="hint" id="why"></p>`;
      if (T.kind === 'draw') h += LEGEND;
    } else h += feedbackHTML();
    card.innerHTML = h;
    renderAxis();
    if (T.checked && T.kind === 'draw' && !T.result.ok) {
      document.getElementById('solWrap').innerHTML = axisSVG(T.ax, sceneSVG(T.spec, T.ax, 'c-ok'));
    }
    bindCard();
    renderStats();
  }

  function feedbackHTML() {
    const r = T.result;
    const cls = r.pts >= 10 ? 'ok' : r.pts > 0 ? 'mid' : 'bad';
    let h = `<div class="fb ${cls}"><div class="fb-head"><span>${r.title}</span><span>${r.pts > 0 ? '+' : '−'}${Math.abs(r.pts)} pts</span></div>`;
    if (T.kind === 'draw' && !r.ok) h += `<div class="fb-label">Correct drawing</div><div class="axis-wrap" id="solWrap"></div>`;
    h += `<p class="explain">${r.explain}</p></div>`;
    h += `<div class="actions"><button class="btn" type="button" id="nextBtn">Next task →</button></div>`;
    return h;
  }

  /* ---------- controls ---------- */
  function placeDot() {
    if (T.checked || T.kind !== 'draw') return;
    if (T.dots.length >= 2) return warn('Both dots are placed. Use Undo to change them.');
    const v = G.target;
    if (T.dots.length === 1 && T.dots[0].v === v) return warn('Walk away from the first dot before placing the second one.');
    T.dots.push({ v, c: T.dotClosed });
    renderAxis();
  }
  function bindCard() {
    card.querySelectorAll('.move').forEach(b => {
      const dir = +b.dataset.dir;
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (T.checked) return;
        releaseHold();
        b.classList.add('held');
        try { b.setPointerCapture(e.pointerId); } catch (err) {}
        stepOnce(dir);
        hold.timer = setTimeout(() => {
          if (T.kind === 'place') { hold.cont = true; hold.dir = dir; kick(); }
          else hold.iv = setInterval(() => stepOnce(dir), 170);
        }, 320);
      });
      ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, releaseHold));
      b.addEventListener('contextmenu', e => e.preventDefault());
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stepOnce(dir); } });
    });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('placeBtn', placeDot);
    on('pickClosed', () => { T.dotClosed = true; syncPicks(); });
    on('pickOpen', () => { T.dotClosed = false; syncPicks(); });
    on('undoBtn', () => { T.dots.pop(); renderAxis(); });
    on('checkBtn', doCheck);
    card.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
      T.sel = +b.dataset.opt;
      card.querySelectorAll('[data-opt]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      renderAxis();
    }));
    const next = document.getElementById('nextBtn');
    if (next) { next.addEventListener('click', newTask); next.focus({ preventScroll: true }); }
  }
  function syncPicks() {
    document.getElementById('pickClosed').setAttribute('aria-pressed', String(T.dotClosed));
    document.getElementById('pickOpen').setAttribute('aria-pressed', String(!T.dotClosed));
  }

  function doCheck() {
    if (T.checked || !canCheck()) return;
    releaseHold();
    G.pos = G.target; G.moving = false;
    let res;
    if (T.kind === 'draw') {
      const ok = key(userSpec()) === key(T.spec);
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite', explain: explainSpec(T.spec, T.variant) };
    } else if (T.kind === 'read') {
      const ok = key(T.options[T.sel]) === key(T.spec);
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite', explain: explainSpec(T.spec, T.variant) };
    } else if (T.kind === 'place') {
      const d = Math.abs(G.target - T.num.v);
      const pts = d <= 0.2 ? 10 : d <= 0.4 ? 5 : -5;
      res = { ok: pts > 0, pts, title: pts === 10 ? 'Spot on!' : pts > 0 ? 'Close!' : 'Too far',
        explain: `${T.num.explain} You stopped at about ${M(fmtDec(G.target, 1))}, off by ${M(fmtDec(d, 2))}. The green flag shows the exact spot.` };
    } else {
      const good = Math.floor(T.num.v), ok = Math.floor(G.target) === good;
      res = { ok, pts: ok ? 10 : -5, title: ok ? 'Correct!' : 'Not quite',
        explain: `${ok ? '' : `The answer is between ${M(fmt(good))} and ${M(fmt(good + 1))}. `}${T.num.explain}` };
    }
    T.checked = true; T.result = res;
    S.n++; S.score += res.pts;
    if (res.ok) { S.ok++; S.streak++; } else { S.bad++; S.streak = 0; }
    S.best = Math.max(S.best, S.score);
    save();
    floatDelta(res.pts);
    renderCard();
  }

  /* ---------- score and settings ---------- */
  function renderStats() {
    document.getElementById('score').textContent = S.score;
    document.getElementById('stats').innerHTML =
      `<span class="streak">streak <b>${S.streak}</b></span><span>correct <b>${S.ok}</b></span><span>wrong <b>${S.bad}</b></span><span>best <b>${S.best}</b></span>`;
  }
  function floatDelta(p) {
    const el = document.createElement('span');
    el.className = 'delta ' + (p > 0 ? 'up' : 'down');
    el.textContent = (p > 0 ? '+' : '−') + Math.abs(p);
    document.getElementById('scoreBox').appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  const setBtn = document.getElementById('setBtn'), settings = document.getElementById('settings');
  setBtn.addEventListener('click', () => {
    settings.hidden = !settings.hidden;
    setBtn.setAttribute('aria-expanded', String(!settings.hidden));
  });
  function renderChips() {
    const box = document.getElementById('typeChips');
    box.innerHTML = Object.entries(TYPES).map(([k, l]) => `<button class="chip" type="button" data-type="${k}" aria-pressed="${!!S.types[k]}">${l}</button>`).join('');
    box.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.type;
      if (S.types[k] && Object.values(S.types).filter(Boolean).length === 1) return;
      S.types[k] = !S.types[k]; save(); renderChips();
      if (!T.checked && !S.types[T.kind]) newTask();
    }));
  }
  let resetArmed = false;
  const resetBtn = document.getElementById('resetBtn'), resetNote = document.getElementById('resetNote');
  const disarm = () => { resetArmed = false; resetBtn.textContent = 'Reset score'; resetBtn.classList.remove('danger'); resetBtn.classList.add('ghost'); };
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true; resetBtn.textContent = 'Yes, reset'; resetBtn.classList.add('danger'); resetBtn.classList.remove('ghost');
      resetNote.textContent = 'Tap again to confirm.';
      setTimeout(() => { if (resetArmed) { disarm(); resetNote.textContent = ''; } }, 4000);
      return;
    }
    disarm();
    Object.assign(S, { score: 0, best: 0, ok: 0, bad: 0, streak: 0, n: 0 }); save();
    resetNote.textContent = 'Score reset.';
    newTask();
  });

  document.addEventListener('keydown', e => {
    if (e.target.closest('.chip, #resetBtn, #setBtn, .move')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); stepOnce(e.key === 'ArrowLeft' ? -1 : 1); return; }
    if (e.key === ' ' && T.kind === 'draw' && !T.checked && !e.target.closest('button')) { e.preventDefault(); placeDot(); return; }
    if (e.key !== 'Enter') return;
    if (T.checked) { e.preventDefault(); newTask(); }
    else if (canCheck() && !e.target.closest('button')) { e.preventDefault(); doCheck(); }
  });
  window.addEventListener('blur', releaseHold);

  renderChips();
  newTask();
})();
</script>
</body>
</html>
