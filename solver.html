<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equation Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one fixed-height screen — header, a slim toolbar, the worked equation (scrolls on its own, always showing the current line), and a compact keypad pinned at the bottom */
:root {
  --paper: #f5f7fc;
  --grid: #e1e7f4;
  --card: #ffffff;
  --ink: #17213b;
  --muted: #5b6784;
  --line: #ccd5e8;
  --pen: #2146c4;
  --pen-soft: #e2e8fb;
  --ok: #12804e;
  --ok-soft: #dcf2e6;
  --bad: #c42c38;
  --gold: #c98a06;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
    --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
    --bad: #ff7b85; --gold: #f2bd45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
  --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
  --bad: #ff7b85; --gold: #f2bd45; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font: 16px/1.5 var(--f-ui);
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

.app {
  height: 100%; max-width: 580px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
}
.bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 90%, transparent); }
.back { text-decoration: none; color: var(--muted); font-size: .85rem; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--card); flex: none; }
.brand { font: 800 1.1rem/1.1 var(--f-display); letter-spacing: -.01em; min-width: 0; }
.score { margin-left: auto; text-align: right; flex: none; }
.score b { font: 800 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums; display: block; color: var(--gold); }
.score span { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.toolbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: .82rem; color: var(--muted); }
.toolbar .steps { margin-right: auto; font-variant-numeric: tabular-nums; }
.toolbar .steps b { color: var(--ink); }
.tool { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: .85rem; }
.tool:disabled { opacity: .45; cursor: default; }

.work {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
  margin: 0 16px; padding: 12px 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  overscroll-behavior: contain;
}
.prompt { margin: 0 0 8px; font: 600 .95rem/1.3 var(--f-display); color: var(--muted); }
.rows-scroll { overflow-x: auto; }
.rows { display: grid; grid-template-columns: 1fr auto 1fr auto; column-gap: 8px; align-items: center; font: 400 1.3rem/1.3 var(--f-math); min-width: max-content; }
.rows .l { text-align: right; white-space: nowrap; }
.rows .eq { text-align: center; }
.rows .r { white-space: nowrap; }
.rows .note { font: 400 1rem/1.1 var(--f-math); color: var(--pen); white-space: nowrap; border-left: 1.5px solid var(--pen); padding-left: 7px; min-width: 56px; }
.rows .note.empty { border-color: transparent; }
.rows .mid { grid-column: 1 / -1; text-align: center; font-size: .78rem; color: var(--muted); padding: 1px 0 6px; white-space: nowrap; }
.rows .row { display: contents; }
.rows .old { color: var(--muted); }
.rows .cur { color: var(--ink); font-weight: 600; padding: 3px 0; }
.rows .done { color: var(--ok); }
.rows i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.1; margin: 0 .06em; }
.frac > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
.msg { margin: 10px 0 0; font-size: .88rem; color: var(--muted); }
.msg:empty { display: none; }
.msg.warn { color: var(--bad); }

.bottom { flex: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.op { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
.op b { font: 600 1.35rem/1 var(--f-math); }
.op span { font-size: .66rem; color: var(--muted); }
.op[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.op[aria-pressed="true"] span { color: var(--card); }
.entry-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.entry { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--pen); border-radius: 12px; padding: 0 12px; height: 48px; background: var(--pen-soft); min-width: 0; }
.entry .both { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.entry .val { font: 400 1.4rem/1.2 var(--f-math); flex: 1; text-align: right; overflow: hidden; white-space: nowrap; }
.entry .val .ph { color: var(--muted); font: 400 .85rem var(--f-ui); }
.apply { border: 0; border-radius: 12px; padding: 0 16px; height: 48px; cursor: pointer; font: 700 .98rem/1.1 var(--f-display); background: var(--pen); color: var(--card); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.key { border: 1px solid var(--line); background: var(--card); border-radius: 12px; height: 44px; cursor: pointer; font: 400 1.3rem/1 var(--f-math); }
.key:active, .op:active, .apply:active { filter: brightness(.94); }
.key.fn { font: 700 .85rem/1 var(--f-ui); color: var(--muted); }
.key.xk { font-style: italic; color: var(--pen); }
.key.wide { grid-column: span 2; }
.key:disabled { opacity: .35; cursor: default; }

.win { border: 1.5px solid var(--ok); background: var(--ok-soft); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
.win h3 { margin: 0; font: 800 1.25rem/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.stars { color: var(--gold); letter-spacing: .1em; font-size: 1.3rem; }
.stars .off { color: var(--line); }
.win p { margin: 0; font-size: .9rem; }
.win .m { font-family: var(--f-math); white-space: nowrap; font-size: 1.08em; }
.next { border: 0; border-radius: 14px; padding: 14px; cursor: pointer; font: 700 1.05rem/1 var(--f-display); background: var(--ok); color: var(--card); }

@media (max-height: 640px) {
  .op, .key { height: 38px; }
  .entry, .apply { height: 42px; }
  .bar { padding-block: 6px; }
  .toolbar { padding-block: 5px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="games.html">← Games</a>
    <div class="brand">Equation Solver</div>
    <div class="score"><b id="stars">0</b><span>stars</span></div>
  </header>
  <div class="toolbar">
    <span class="steps" id="steps"></span>
    <button class="tool" type="button" id="undoBtn">Undo</button>
    <button class="tool" type="button" id="newBtn">New equation</button>
  </div>
  <section class="work" id="work" aria-live="polite"><p class="msg">Loading…</p><noscript><p class="msg">This page needs JavaScript. Open it in Chrome or Safari, not in a file preview.</p></noscript></section>
  <section class="bottom" id="bottom"></section>
</div>

<script>
window.addEventListener('error', function (e) {
  var c = document.getElementById('work');
  if (c) c.innerHTML = '<p class="msg warn">Something went wrong: ' + String(e.message).replace(/</g, '&lt;') + '</p>';
});
</script>
<script>
(() => {
  /* ---------- helpers ---------- */
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const coin = (p = 0.5) => Math.random() < p;
  const nz = (a, b) => { let v; do { v = rint(a, b); } while (v === 0); return v; };
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const fmt = n => n < 0 ? '−' + (-n) : String(n);
  const fracH = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const X_ = '<i>x</i>';

  /* ---------- fractions ---------- */
  const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
  const add = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => F(a.n * b.n, a.d * b.d);
  const div = (a, b) => F(a.n * b.d, a.d * b.n);
  const isZ = a => a.n === 0;
  const isOne = a => a.n === 1 && a.d === 1;
  const big = a => Math.abs(a.n) > 99999 || a.d > 99999;

  /* ---------- formatting (sides are { a: coefficient of x, b: constant }) ---------- */
  const numH = f => f.d === 1 ? fmt(f.n) : (f.n < 0 ? '−' : '') + fracH(Math.abs(f.n), f.d);
  function xTermH(a) {
    if (a.d === 1) return a.n === 1 ? X_ : a.n === -1 ? '−' + X_ : fmt(a.n) + X_;
    return (a.n < 0 ? '−' : '') + fracH((Math.abs(a.n) === 1 ? '' : Math.abs(a.n)) + X_, a.d);
  }
  function sideH(s) {
    if (isZ(s.a)) return numH(s.b);
    let t = xTermH(s.a);
    if (!isZ(s.b)) t += (s.b.n < 0 ? ' − ' : ' + ') + numH(F(Math.abs(s.b.n), s.b.d));
    return t;
  }
  const operandH = (n, isX) => isX ? xTermH(n) : numH(n);
  const wrapNeg = (n, isX) => n.n < 0 ? `(${operandH(n, isX)})` : operandH(n, isX);
  const SYM = { add: '+', sub: '−', mul: '·', div: '÷' };

  function applyOp(s, op) {
    const t = op.x ? { a: op.n, b: F(0) } : { a: F(0), b: op.n };
    if (op.type === 'add') return { a: add(s.a, t.a), b: add(s.b, t.b) };
    if (op.type === 'sub') return { a: sub(s.a, t.a), b: sub(s.b, t.b) };
    if (op.type === 'mul') return { a: mul(s.a, op.n), b: mul(s.b, op.n) };
    return { a: div(s.a, op.n), b: div(s.b, op.n) };
  }
  // the unsimplified line, e.g. "3x + 5 − 5"
  function midSide(s, html, atomic, op) {
    const h = html || sideH(s);
    if (op.type === 'add' || op.type === 'sub') return `${h} ${SYM[op.type]} ${wrapNeg(op.n, op.x)}`;
    const two = !atomic && !isZ(s.a) && !isZ(s.b);
    return `${two ? `(${h})` : h} ${SYM[op.type]} ${wrapNeg(op.n, false)}`;
  }
  const noteH = op => `${SYM[op.type]} ${wrapNeg(op.n, op.x)}`;

  /* ---------- equation generator (mixed difficulty) ---------- */
  const S0 = s => ({ a: F(s[0][0], s[0][1] || 1), b: F(s[1][0], s[1][1] || 1) });
  function gen() {
    const r = Math.random(), level = r < 0.15 ? 1 : r < 0.5 ? 2 : r < 0.8 ? 3 : 4;
    const s = rint(-9, 9);
    let L, R, Lh = null, first = null, swap = false;
    if (level === 1) {
      const f = rint(0, 2);
      if (f === 0) { const a = nz(-9, 9); L = S0([[1], [a]]); R = S0([[0], [s + a]]); }
      else if (f === 1) { const a = pick([-1, 1]) * rint(2, 9); L = S0([[a], [0]]); R = S0([[0], [a * s]]); }
      else { const a = rint(2, 6), k = rint(-6, 6); L = S0([[1, a], [0]]); R = S0([[0], [k]]); return finish(L, R, null, null, k * a, false); }
      swap = coin(0.25);
    } else if (level === 2) {
      const f = rint(0, 3);
      if (f <= 1) { const a = pick([-1, 1]) * rint(2, 9), b = nz(-12, 12); L = S0([[a], [b]]); R = S0([[0], [a * s + b]]); }
      else if (f === 2) { const a = rint(2, 5), k = rint(-5, 5), b = nz(-9, 9); L = S0([[1, a], [b]]); R = S0([[0], [k + b]]); return finish(L, R, null, null, k * a, coin(0.25)); }
      else { const a = rint(2, 6), b = nz(-12, 12); L = S0([[-a], [b]]); R = S0([[0], [b - a * s]]); }
      swap = coin(0.3);
    } else if (level === 3) {
      let a, c; do { a = nz(-6, 9); c = nz(-6, 9); } while (a === c);
      const b = rint(-12, 12), d = a * s + b - c * s;
      L = S0([[a], [b]]); R = S0([[c], [d]]);
    } else {
      const f = rint(0, 2);
      if (f === 0) {
        const a = pick([-3, -2, 2, 3, 4, 5, 6]), b = nz(-9, 9);
        L = S0([[a], [a * b]]); R = S0([[0], [a * (s + b)]]);
        Lh = `${fmt(a)}(${X_} ${b < 0 ? '−' : '+'} ${Math.abs(b)})`;
        first = { type: 'div', n: F(a), x: false };
      } else if (f === 1) {
        const a = rint(2, 6), b = nz(-9, 9), k = rint(-6, 6), sol = a * k - b;
        L = { a: F(1, a), b: F(b, a) }; R = S0([[0], [k]]);
        Lh = fracH(`${X_} ${b < 0 ? '−' : '+'} ${Math.abs(b)}`, a);
        first = { type: 'mul', n: F(a), x: false };
        return finish(L, R, Lh, first, sol, false);
      } else {
        let a, q; do { a = rint(1, 5); q = rint(2, 5); } while (gcd(a, q) !== 1);
        const k = rint(-4, 4), c = nz(-9, 9);
        L = { a: F(a, q), b: F(c) }; R = S0([[0], [a * k + c]]);
        return finish(L, R, null, null, q * k, coin(0.25));
      }
    }
    return finish(L, R, Lh, first, s, swap);
  }
  function finish(L, R, Lh, first, sol, swap) {
    const row = swap ? { L: R, R: L, Rh: Lh, Lh: null } : { L, R, Lh, Rh: null };
    const eq = { rows: [row], sol, first, solved: false };
    eq.opt = optimalSteps(eq);
    return eq;
  }

  /* ---------- shortest solution (used to award stars) ---------- */
  function nextStep(L, R) {
    if (!isZ(L.a) && !isZ(R.a)) return { type: 'sub', n: R.a, x: true };
    const S = isZ(L.a) ? R : L;
    if (!isZ(S.b)) return { type: 'sub', n: S.b, x: false };
    if (S.a.d !== 1) return { type: 'mul', n: F(S.a.d), x: false };
    return { type: 'div', n: S.a, x: false };
  }
  const isSolved = (L, R) => (isOne(L.a) && isZ(L.b) && isZ(R.a)) || (isOne(R.a) && isZ(R.b) && isZ(L.a));
  function optimalSteps(eq) {
    let { L, R } = eq.rows[0], n = 0, op = eq.first;
    while (!isSolved(L, R) && n < 8) {
      op = op || nextStep(L, R);
      L = applyOp(L, op); R = applyOp(R, op); n++; op = null;
    }
    return n;
  }

  /* ---------- state ---------- */
  const KEY = 'equationSolver.v1';
  let ST = { stars: 0, solved: 0 };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) ST = Object.assign(ST, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };

  let EQ = null;
  const IN = { type: 'sub', text: '' };   // keypad entry, text like "-3/4x"
  let msg = { text: '', cls: '' };

  function newEquation() {
    EQ = gen();
    IN.type = 'sub'; IN.text = '';
    msg = { text: '', cls: '' };
    render();
  }

  /* ---------- rendering ---------- */
  const work = document.getElementById('work'), bottom = document.getElementById('bottom');

  function render() {
    document.getElementById('stars').textContent = ST.stars;
    const rows = EQ.rows, lastI = rows.length - 1, steps = lastI;
    document.getElementById('steps').innerHTML = `Solved <b>${ST.solved}</b> · steps <b>${steps}</b>`;
    document.getElementById('undoBtn').disabled = !steps || EQ.solved;
    let g = '';
    rows.forEach((r, i) => {
      const cls = i === lastI ? (EQ.solved ? 'cur done' : 'cur') : 'old';
      const next = rows[i + 1];
      g += `<div class="row"><span class="l ${cls}">${r.Lh || sideH(r.L)}</span><span class="eq ${cls}">=</span><span class="r ${cls}">${r.Rh || sideH(r.R)}</span><span class="note${next ? '' : ' empty'}">${next ? noteH(next.op) : ''}</span></div>`;
      if (next) g += `<div class="mid">${next.mid}</div>`;
    });
    work.innerHTML = `<p class="prompt">Solve for ${X_}. Do the same thing to both sides.</p><div class="rows-scroll"><div class="rows">${g}</div></div><p class="msg ${msg.cls}" id="msg">${msg.text}</p>`;
    work.scrollTop = work.scrollHeight;
    renderBottom();
  }

  function winH() {
    const steps = EQ.rows.length - 1, st = EQ.stars;
    const first = EQ.rows[0];
    const s = F(EQ.sol);
    const lv = add(mul(first.L.a, s), first.L.b), rv = add(mul(first.R.a, s), first.R.b);
    const stars = '★'.repeat(st) + `<span class="off">${'★'.repeat(3 - st)}</span>`;
    const p = steps <= EQ.opt ? `You used ${steps} step${steps === 1 ? '' : 's'}, the shortest possible way.`
      : `You used ${steps} steps. It can be done in ${EQ.opt}.`;
    return `<div class="win"><h3><span class="m">${X_} = ${fmt(EQ.sol)}</span><span class="stars" aria-label="${st} of 3 stars">${stars}</span></h3>
      <p>${p}</p>
      <p>Check in the first line: left side <span class="m">${numH(lv)}</span>, right side <span class="m">${numH(rv)}</span> ✓</p>
      <button class="next" type="button" id="nextBtn">Next equation →</button></div>`;
  }

  function entryH() {
    if (!IN.text) return '<span class="ph">type a number</span>';
    const p = parseEntry(IN.text);
    return p ? operandH(p.n, p.x) : IN.text.replace('-', '−').replace('x', X_);
  }
  function renderBottom() {
    if (EQ.solved) {
      bottom.innerHTML = winH();
      const nb = document.getElementById('nextBtn');
      nb.addEventListener('click', newEquation);
      nb.focus({ preventScroll: true });
      return;
    }
    const xBad = IN.type === 'mul' || IN.type === 'div';
    bottom.innerHTML = `
      <div class="ops">${['add', 'sub', 'mul', 'div'].map(t => `<button class="op" type="button" data-op="${t}" aria-pressed="${IN.type === t}"><b>${{ add: '+', sub: '−', mul: '×', div: '÷' }[t]}</b><span>${{ add: 'add', sub: 'subtract', mul: 'multiply', div: 'divide' }[t]}</span></button>`).join('')}</div>
      <div class="entry-row">
        <div class="entry"><span class="both">both sides ${SYM[IN.type]}</span><span class="val" id="val">${entryH()}</span></div>
        <button class="apply" type="button" id="applyBtn">Apply</button>
      </div>
      <div class="keys">
        ${['7', '8', '9'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key fn" type="button" data-k="back" aria-label="Delete">⌫</button>
        ${['4', '5', '6'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key xk" type="button" data-k="x" ${xBad ? 'disabled' : ''}>x</button>
        ${['1', '2', '3'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key fn" type="button" data-k="/">a/b</button>
        <button class="key" type="button" data-k="neg">±</button><button class="key" type="button" data-k="0">0</button><button class="key fn wide" type="button" data-k="clear">clear</button>
      </div>`;
    bottom.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
      IN.type = b.dataset.op;
      if ((IN.type === 'mul' || IN.type === 'div') && IN.text.includes('x')) IN.text = IN.text.replace('x', '');
      renderBottom();
    }));
    bottom.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
    document.getElementById('applyBtn').addEventListener('click', doApply);
  }
  function refreshEntry() { const v = document.getElementById('val'); if (v) v.innerHTML = entryH(); }

  function setMsg(text, cls = '') {
    msg = { text, cls };
    const m = document.getElementById('msg');
    if (m) { m.className = 'msg ' + cls; m.innerHTML = text; work.scrollTop = work.scrollHeight; }
  }

  /* ---------- input ---------- */
  function key(k) {
    if (EQ.solved) return;
    let t = IN.text;
    if (k === 'back') t = t.slice(0, -1);
    else if (k === 'clear') t = '';
    else if (k === 'neg') t = t.startsWith('-') ? t.slice(1) : '-' + t;
    else if (k === 'x') { if (IN.type === 'mul' || IN.type === 'div') return; if (!t.includes('x') && !t.endsWith('/')) t += 'x'; }
    else if (k === '/') { if (!t.includes('/') && !t.includes('x') && /\d$/.test(t)) t += '/'; }
    else if (/\d/.test(k)) { if (t.includes('x')) return; if (t.replace(/\D/g, '').length >= 6) return; t += k; }
    IN.text = t;
    if (msg.cls === 'warn') setMsg('');
    refreshEntry();
  }
  function parseEntry(t) {
    const m = /^(-?)(\d*)(?:\/(\d+))?(x?)$/.exec(t);
    if (!m) return null;
    const [, sg, num, den, xs] = m;
    if (!num && !xs) return null;
    if (!num && den) return null;
    const n = num ? +num : 1, d = den ? +den : 1;
    if (d === 0) return null;
    return { n: F(sg ? -n : n, d), x: !!xs };
  }

  function doApply() {
    if (EQ.solved) return;
    if (!IN.text) return setMsg('Type a number first.', 'warn');
    const p = parseEntry(IN.text);
    if (!p) return setMsg('That number is not finished yet. Examples: 5, −3, 2/3, 4x.', 'warn');
    if (p.x && (IN.type === 'mul' || IN.type === 'div')) return setMsg(`Multiplying or dividing by ${X_} would turn this into a different kind of equation.`, 'warn');
    if (isZ(p.n)) {
      if (IN.type === 'div') return setMsg('You can’t divide by 0.', 'warn');
      if (IN.type === 'mul') return setMsg('Multiplying both sides by 0 gives 0 = 0 and loses the equation. Try another number.', 'warn');
      return setMsg('Adding or subtracting 0 doesn’t change anything.', 'warn');
    }
    const op = { type: IN.type, n: p.n, x: p.x };
    const last = EQ.rows[EQ.rows.length - 1];
    const L = applyOp(last.L, op), R = applyOp(last.R, op);
    if ([L.a, L.b, R.a, R.b].some(big)) return setMsg('The numbers are getting too big. Try Undo and a different step.', 'warn');
    const mid = `${midSide(last.L, last.Lh, !!last.Lh, op)} = ${midSide(last.R, last.Rh, !!last.Rh, op)}`;
    EQ.rows.push({ L, R, op, mid });
    IN.text = '';
    msg = { text: '', cls: '' };
    if (isSolved(L, R)) {
      EQ.solved = true;
      const steps = EQ.rows.length - 1;
      const st = steps <= EQ.opt ? 3 : steps <= EQ.opt + 2 ? 2 : 1;
      EQ.stars = st; ST.stars += st; ST.solved++; save();
    } else if (isZ(L.a) && isZ(R.a)) {
      msg = { text: `Both ${X_} terms are gone. Use Undo and keep ${X_} on one side.`, cls: 'warn' };
    }
    render();
  }

  document.getElementById('undoBtn').addEventListener('click', () => {
    if (EQ.rows.length > 1 && !EQ.solved) { EQ.rows.pop(); msg = { text: '', cls: '' }; render(); }
  });
  document.getElementById('newBtn').addEventListener('click', newEquation);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (EQ.solved) { if (k === 'Enter') { e.preventDefault(); newEquation(); } return; }
    if (/^\d$/.test(k)) key(k);
    else if (k === 'x' || k === 'X') key('x');
    else if (k === '/') { e.preventDefault(); key('/'); }
    else if (k === '-') key('neg');
    else if (k === 'Backspace') key('back');
    else if (k === 'Enter' && !e.target.closest('button')) { e.preventDefault(); doApply(); }
  });

  newEquation();
})();
</script>
</body>
</html>
