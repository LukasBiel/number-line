<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equation Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: graph-paper notebook — the solution is written row by row like in an exercise book, with the "| −5" step note on the right; a sticky keypad sits at the bottom */
:root {
  --paper: #f5f7fc;
  --grid: #e1e7f4;
  --card: #ffffff;
  --ink: #17213b;
  --muted: #5b6784;
  --line: #ccd5e8;
  --pen: #2146c4;
  --pen-soft: #e2e8fb;
  --ok: #12804e;
  --ok-soft: #dcf2e6;
  --bad: #c42c38;
  --bad-soft: #fbe2e4;
  --gold: #c98a06;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
    --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
    --bad: #ff7b85; --bad-soft: #3b1920; --gold: #f2bd45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1322; --grid: #19213a; --card: #151c31; --ink: #e6ebf8; --muted: #96a2c0;
  --line: #2c3758; --pen: #7f9cff; --pen-soft: #1e2a55; --ok: #4fd196; --ok-soft: #12321f;
  --bad: #ff7b85; --bad-soft: #3b1920; --gold: #f2bd45; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.5 var(--f-ui);
  min-height: 100vh;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 580px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.back { text-decoration: none; color: var(--muted); font-size: .85rem; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--card); flex: none; }
.brand { font: 800 1.15rem/1 var(--f-display); letter-spacing: -.01em; }
.brand small { display: block; font: 400 .72rem/1.3 var(--f-ui); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
.score { margin-left: auto; text-align: right; }
.score b { font: 800 1.5rem/1 var(--f-display); font-variant-numeric: tabular-nums; display: block; color: var(--gold); }
.score span { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

main { max-width: 580px; margin: 0 auto; padding: 14px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
main > * { min-width: 0; }
.levels { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.levels::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: .85rem; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--pen-soft); border-color: var(--pen); font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 14px; display: grid; gap: 10px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px color-mix(in srgb, var(--pen) 45%, transparent); }
.card > * { min-width: 0; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.eyebrow b { color: var(--pen); }
.prompt { margin: 0; font: 600 1.05rem/1.3 var(--f-display); }

.work { overflow-x: auto; padding: 4px 2px; }
.rows { display: grid; grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr) minmax(64px, auto); column-gap: 10px; align-items: center; font: 400 1.35rem/1.25 var(--f-math); }
.rows .l { text-align: right; white-space: nowrap; }
.rows .eq { text-align: center; }
.rows .r { white-space: nowrap; }
.rows .note { font: 400 1rem/1 var(--f-math); color: var(--pen); white-space: nowrap; border-left: 1.5px solid var(--pen); padding-left: 8px; }
.rows .mid { grid-column: 1 / -1; text-align: center; font-size: .82rem; color: var(--muted); padding: 2px 0 6px; white-space: nowrap; }
.rows .row { display: contents; }
.rows .cur { color: var(--ink); }
.rows .old { color: var(--muted); }
.rows .cur.l, .rows .cur.r, .rows .cur.eq { font-size: 1.15em; font-weight: 600; padding: 4px 0; }
.rows .done { color: var(--ok); }
.rows i { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.1; margin: 0 .06em; }
.frac > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }

.msg { margin: 0; font-size: .9rem; color: var(--muted); min-height: 1.35em; }
.msg.warn { color: var(--bad); }
.msg.tip { color: var(--ink); background: var(--pen-soft); border-radius: 10px; padding: 8px 10px; }
.msg .m { font-family: var(--f-math); white-space: nowrap; }
.tools { display: flex; gap: 8px; }
.tool { flex: 1; border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 9px 6px; cursor: pointer; font-size: .9rem; }
.tool:disabled { opacity: .45; cursor: default; }

.pad {
  position: sticky; bottom: 0; z-index: 4;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 10px; box-shadow: 0 -8px 24px -18px color-mix(in srgb, var(--ink) 40%, transparent);
}
.ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.op { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 6px 2px; cursor: pointer; display: grid; justify-items: center; line-height: 1.1; touch-action: manipulation; }
.op b { font: 600 1.45rem/1.1 var(--f-math); }
.op span { font-size: .68rem; color: var(--muted); }
.op[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.op[aria-pressed="true"] span { color: var(--card); }
.entry { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--pen); border-radius: 12px; padding: 6px 12px; min-height: 52px; background: var(--pen-soft); }
.entry .both { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.entry .val { font: 400 1.5rem/1.2 var(--f-math); flex: 1; text-align: right; overflow-x: auto; white-space: nowrap; }
.entry .val .ph { color: var(--muted); font: 400 .9rem var(--f-ui); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; height: 46px; cursor: pointer; font: 400 1.3rem/1 var(--f-math); touch-action: manipulation; }
.key.fn { font: 700 .9rem/1 var(--f-ui); color: var(--muted); }
.key.xk { font-style: italic; color: var(--pen); }
.key:disabled { opacity: .35; cursor: default; }
.apply { border: 0; border-radius: 14px; padding: 14px; cursor: pointer; font: 700 1.05rem/1 var(--f-display); background: var(--pen); color: var(--card); touch-action: manipulation; }

.win { border: 1.5px solid var(--ok); background: var(--ok-soft); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.win h3 { margin: 0; font: 800 1.25rem/1.2 var(--f-display); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.stars { color: var(--gold); letter-spacing: .1em; font-size: 1.3rem; }
.stars .off { color: var(--line); }
.win p { margin: 0; font-size: .92rem; }
.win .m { font-family: var(--f-math); white-space: nowrap; font-size: 1.08em; }
.next { border: 0; border-radius: 14px; padding: 14px; cursor: pointer; font: 700 1.05rem/1 var(--f-display); background: var(--ok); color: var(--card); }

@media (max-width: 380px) {
  .rows { font-size: 1.15rem; }
  .key { height: 42px; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="back" href="games.html">← Games</a>
    <div class="brand">Equation Solver<small>one step at a time</small></div>
    <div class="score"><b id="stars">0</b><span>stars</span></div>
  </div>
</header>

<main>
  <div class="levels" id="levels" role="group" aria-label="Difficulty"></div>
  <article class="card" id="card"><p class="msg">Loading…</p><noscript><p class="msg">This page needs JavaScript. Open it in Chrome or Safari, not in a file preview.</p></noscript></article>
  <section class="pad" id="pad"></section>
</main>

<script>
window.addEventListener('error', function (e) {
  var c = document.getElementById('card');
  if (c) c.innerHTML = '<p class="msg warn">Something went wrong: ' + String(e.message).replace(/</g, '&lt;') + '</p>';
});
</script>
<script>
(() => {
  /* ---------- helpers ---------- */
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const coin = (p = 0.5) => Math.random() < p;
  const nz = (a, b) => { let v; do { v = rint(a, b); } while (v === 0); return v; };
  const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
  const fmt = n => n < 0 ? '−' + (-n) : String(n);
  const fracH = (p, q) => `<span class="frac"><span>${p}</span><span>${q}</span></span>`;
  const X_ = '<i>x</i>';

  /* ---------- fractions ---------- */
  const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
  const add = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => F(a.n * b.n, a.d * b.d);
  const div = (a, b) => F(a.n * b.d, a.d * b.n);
  const neg = a => F(-a.n, a.d);
  const isZ = a => a.n === 0;
  const isOne = a => a.n === 1 && a.d === 1;
  const big = a => Math.abs(a.n) > 99999 || a.d > 99999;
  const val = a => a.n / a.d;

  /* ---------- formatting (sides are { a: coefficient of x, b: constant }) ---------- */
  const numH = f => f.d === 1 ? fmt(f.n) : (f.n < 0 ? '−' : '') + fracH(Math.abs(f.n), f.d);
  function xTermH(a) {
    if (a.d === 1) return a.n === 1 ? X_ : a.n === -1 ? '−' + X_ : fmt(a.n) + X_;
    return (a.n < 0 ? '−' : '') + fracH((Math.abs(a.n) === 1 ? '' : Math.abs(a.n)) + X_, a.d);
  }
  function sideH(s) {
    if (isZ(s.a)) return numH(s.b);
    let t = xTermH(s.a);
    if (!isZ(s.b)) t += (s.b.n < 0 ? ' − ' : ' + ') + numH(F(Math.abs(s.b.n), s.b.d));
    return t;
  }
  const operandH = (n, isX) => isX ? xTermH(n) : numH(n);
  const wrapNeg = (n, isX) => n.n < 0 ? `(${operandH(n, isX)})` : operandH(n, isX);
  const SYM = { add: '+', sub: '−', mul: '·', div: '÷' };
  const VERB = { add: 'add', sub: 'subtract', mul: 'multiply by', div: 'divide by' };

  function applyOp(s, op) {
    const t = op.x ? { a: op.n, b: F(0) } : { a: F(0), b: op.n };
    if (op.type === 'add') return { a: add(s.a, t.a), b: add(s.b, t.b) };
    if (op.type === 'sub') return { a: sub(s.a, t.a), b: sub(s.b, t.b) };
    if (op.type === 'mul') return { a: mul(s.a, op.n), b: mul(s.b, op.n) };
    return { a: div(s.a, op.n), b: div(s.b, op.n) };
  }
  // the unsimplified line, e.g. "3x + 5 − 5"
  function midSide(s, html, atomic, op) {
    const h = html || sideH(s);
    if (op.type === 'add' || op.type === 'sub') return `${h} ${SYM[op.type]} ${wrapNeg(op.n, op.x)}`;
    const two = !atomic && !isZ(s.a) && !isZ(s.b);
    return `${two ? `(${h})` : h} ${SYM[op.type]} ${wrapNeg(op.n, false)}`;
  }
  const noteH = op => `${SYM[op.type]} ${wrapNeg(op.n, op.x)}`;

  /* ---------- equation generator ---------- */
  const LEVELS = [
    { id: 'mix', label: 'Mix' },
    { id: 1, label: 'One step' },
    { id: 2, label: 'Two steps' },
    { id: 3, label: 'x on both sides' },
    { id: 4, label: 'Brackets & fractions' }
  ];
  const S0 = s => ({ a: F(s[0][0], s[0][1] || 1), b: F(s[1][0], s[1][1] || 1) });
  function gen(level) {
    if (level === 'mix') { const r = Math.random(); level = r < 0.15 ? 1 : r < 0.5 ? 2 : r < 0.8 ? 3 : 4; }
    const s = rint(-9, 9);
    let L, R, Lh = null, first = null, swap = false;
    if (level === 1) {
      const f = rint(0, 2);
      if (f === 0) { const a = nz(-9, 9); L = S0([[1], [a]]); R = S0([[0], [s + a]]); }
      else if (f === 1) { const a = pick([-1, 1]) * rint(2, 9); L = S0([[a], [0]]); R = S0([[0], [a * s]]); }
      else { const a = rint(2, 6), k = rint(-6, 6); L = S0([[1, a], [0]]); R = S0([[0], [k]]); return finish(L, R, null, null, k * a, false); }
      swap = coin(0.25);
    } else if (level === 2) {
      const f = rint(0, 3);
      if (f <= 1) { const a = pick([-1, 1]) * rint(2, 9), b = nz(-12, 12); L = S0([[a], [b]]); R = S0([[0], [a * s + b]]); }
      else if (f === 2) { const a = rint(2, 5), k = rint(-5, 5), b = nz(-9, 9); L = S0([[1, a], [b]]); R = S0([[0], [k + b]]); return finish(L, R, null, null, k * a, coin(0.25)); }
      else { const a = rint(2, 6), b = nz(-12, 12); L = S0([[-a], [b]]); R = S0([[0], [b - a * s]]); }
      swap = coin(0.3);
    } else if (level === 3) {
      let a, c; do { a = nz(-6, 9); c = nz(-6, 9); } while (a === c);
      const b = rint(-12, 12), d = a * s + b - c * s;
      L = S0([[a], [b]]); R = S0([[c], [d]]);
    } else {
      const f = rint(0, 2);
      if (f === 0) {
        const a = pick([-3, -2, 2, 3, 4, 5, 6]), b = nz(-9, 9);
        L = S0([[a], [a * b]]); R = S0([[0], [a * (s + b)]]);
        Lh = `${a === -1 ? '−' : fmt(a)}(${X_} ${b < 0 ? '−' : '+'} ${Math.abs(b)})`;
        first = { type: 'div', n: F(a), x: false, text: `Divide both sides by ${fmt(a)} to get rid of the bracket.` };
      } else if (f === 1) {
        const a = rint(2, 6), b = nz(-9, 9), k = rint(-6, 6), sol = a * k - b;
        L = { a: F(1, a), b: F(b, a) }; R = S0([[0], [k]]);
        Lh = fracH(`${X_} ${b < 0 ? '−' : '+'} ${Math.abs(b)}`, a);
        first = { type: 'mul', n: F(a), x: false, text: `Multiply both sides by ${a} to clear the fraction.` };
        return finish(L, R, Lh, first, sol, false);
      } else {
        let a, q; do { a = rint(1, 5); q = rint(2, 5); } while (gcd(a, q) !== 1);
        const k = rint(-4, 4), c = nz(-9, 9);
        L = { a: F(a, q), b: F(c) }; R = S0([[0], [a * k + c]]);
        return finish(L, R, null, null, q * k, coin(0.25));
      }
    }
    return finish(L, R, Lh, first, s, swap);
  }
  function finish(L, R, Lh, first, sol, swap) {
    const row = swap ? { L: R, R: L, Rh: Lh, Lh: null } : { L, R, Lh, Rh: null };
    const eq = { rows: [row], sol, first, hints: 0, solved: false };
    eq.opt = optimalSteps(eq);
    return eq;
  }

  /* ---------- hints: the natural next step ---------- */
  function hintFor(eq) {
    const last = eq.rows[eq.rows.length - 1];
    if (eq.rows.length === 1 && eq.first) return eq.first;
    return nextStep(last.L, last.R);
  }
  function nextStep(L, R) {
    if (!isZ(L.a) && !isZ(R.a)) {
      const c = R.a, absC = F(Math.abs(c.n), c.d);
      return c.n > 0
        ? { type: 'sub', n: c, x: true, text: `Collect the ${X_} terms on one side: subtract ${xTermH(c)} from both sides.` }
        : { type: 'add', n: absC, x: true, text: `Collect the ${X_} terms on one side: add ${xTermH(absC)} to both sides.` };
    }
    const S = isZ(L.a) ? R : L;
    if (!isZ(S.b)) {
      const absB = F(Math.abs(S.b.n), S.b.d);
      return S.b.n > 0
        ? { type: 'sub', n: absB, x: false, text: `Move the number away from ${X_}: subtract ${numH(absB)} from both sides.` }
        : { type: 'add', n: absB, x: false, text: `Move the number away from ${X_}: add ${numH(absB)} to both sides.` };
    }
    if (S.a.d !== 1) return { type: 'mul', n: F(S.a.d), x: false, text: `Clear the fraction: multiply both sides by ${S.a.d}.` };
    return { type: 'div', n: S.a, x: false, text: `${X_} is multiplied by ${fmt(S.a.n)}. Divide both sides by ${fmt(S.a.n)} so ${X_} stands alone.` };
  }
  const isSolved = (L, R) => (isOne(L.a) && isZ(L.b) && isZ(R.a)) || (isOne(R.a) && isZ(R.b) && isZ(L.a));
  function optimalSteps(eq) {
    let { L, R } = eq.rows[0], n = 0, op = eq.first;
    while (!isSolved(L, R) && n < 8) {
      op = op || nextStep(L, R);
      L = applyOp(L, op); R = applyOp(R, op); n++; op = null;
    }
    return n;
  }

  /* ---------- state ---------- */
  const KEY = 'equationSolver.v1';
  let ST = { stars: 0, solved: 0, level: 'mix' };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) ST = Object.assign(ST, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };

  let EQ = null;
  const IN = { type: 'sub', text: '' };   // keypad entry, text like "-3/4x"
  let msg = { text: '', cls: '' };

  function newEquation() {
    EQ = gen(ST.level);
    IN.type = 'sub'; IN.text = '';
    msg = { text: 'Choose an operation, type a number and tap “Apply to both sides”.', cls: '' };
    render();
  }

  /* ---------- rendering ---------- */
  const card = document.getElementById('card'), pad = document.getElementById('pad');

  function renderLevels() {
    const box = document.getElementById('levels');
    box.innerHTML = LEVELS.map(l => `<button class="chip" type="button" data-level="${l.id}" aria-pressed="${String(ST.level) === String(l.id)}">${l.label}</button>`).join('');
    box.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.level;
      ST.level = v === 'mix' ? 'mix' : +v; save(); renderLevels(); newEquation();
    }));
  }

  function render() {
    document.getElementById('stars').textContent = ST.stars;
    const rows = EQ.rows, lastI = rows.length - 1;
    let g = '';
    rows.forEach((r, i) => {
      const cls = i === lastI ? (EQ.solved ? 'cur done' : 'cur') : 'old';
      const next = rows[i + 1];
      g += `<div class="row"><span class="l ${cls}">${r.Lh || sideH(r.L)}</span><span class="eq ${cls}">=</span><span class="r ${cls}">${r.Rh || sideH(r.R)}</span><span class="note">${next ? noteH(next.op) : ''}</span></div>`;
      if (next) g += `<div class="mid">${next.mid}</div>`;
    });
    const steps = rows.length - 1;
    let h = `<div class="eyebrow"><span><b>Solved ${ST.solved}</b></span><span>steps: ${steps}</span></div>`;
    h += `<h2 class="prompt">Solve for ${X_}. Do the same thing to both sides.</h2>`;
    h += `<div class="work" id="work"><div class="rows">${g}</div></div>`;
    if (EQ.solved) h += winH();
    else {
      h += `<p class="msg ${msg.cls}" id="msg">${msg.text}</p>`;
      h += `<div class="tools"><button class="tool" type="button" id="undoBtn" ${steps ? '' : 'disabled'}>Undo</button><button class="tool" type="button" id="hintBtn">Hint</button><button class="tool" type="button" id="newBtn">New equation</button></div>`;
    }
    card.innerHTML = h;
    const work = document.getElementById('work'); work.scrollLeft = 0;
    bindCard();
    renderPad();
  }

  function winH() {
    const steps = EQ.rows.length - 1, st = EQ.stars;
    const first = EQ.rows[0];
    const s = F(EQ.sol);
    const lv = add(mul(first.L.a, s), first.L.b), rv = add(mul(first.R.a, s), first.R.b);
    const stars = '★'.repeat(st) + `<span class="off">${'★'.repeat(3 - st)}</span>`;
    let p = steps <= EQ.opt ? `You used ${steps} step${steps === 1 ? '' : 's'}, the shortest possible way.`
      : `You used ${steps} steps. It can be done in ${EQ.opt}.`;
    if (EQ.hints) p += ` Hints used: ${EQ.hints}.`;
    return `<div class="win"><h3><span><span class="m">${X_} = ${fmt(EQ.sol)}</span></span><span class="stars" aria-label="${st} of 3 stars">${stars}</span></h3>
      <p>${p}</p>
      <p>Check in the first line: left side <span class="m">${numH(lv)}</span>, right side <span class="m">${numH(rv)}</span> ✓</p>
      <button class="next" type="button" id="nextBtn">Next equation →</button></div>`;
  }

  function entryH() {
    if (!IN.text) return '<span class="ph">type a number</span>';
    const p = parseEntry(IN.text, true);
    return p ? operandH(p.n, p.x) : IN.text.replace('-', '−').replace('x', X_);
  }
  function renderPad() {
    if (EQ.solved) { pad.hidden = true; return; }
    pad.hidden = false;
    const xBad = IN.type === 'mul' || IN.type === 'div';
    pad.innerHTML = `
      <div class="ops">${['add', 'sub', 'mul', 'div'].map(t => `<button class="op" type="button" data-op="${t}" aria-pressed="${IN.type === t}"><b>${{ add: '+', sub: '−', mul: '×', div: '÷' }[t]}</b><span>${{ add: 'add', sub: 'subtract', mul: 'multiply', div: 'divide' }[t]}</span></button>`).join('')}</div>
      <div class="entry"><span class="both">both sides ${SYM[IN.type]}</span><span class="val" id="val">${entryH()}</span></div>
      <div class="keys">
        ${['7', '8', '9'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key fn" type="button" data-k="back" aria-label="Delete">⌫</button>
        ${['4', '5', '6'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key xk" type="button" data-k="x" ${xBad ? 'disabled' : ''}>x</button>
        ${['1', '2', '3'].map(k => `<button class="key" type="button" data-k="${k}">${k}</button>`).join('')}<button class="key fn" type="button" data-k="/">a/b</button>
        <button class="key" type="button" data-k="neg">±</button><button class="key" type="button" data-k="0">0</button><button class="key fn" type="button" data-k="clear">clear</button><button class="key fn" type="button" data-k="hint" aria-label="Fill in the hint">fill hint</button>
      </div>
      <button class="apply" type="button" id="applyBtn">Apply to both sides</button>`;
    pad.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
      IN.type = b.dataset.op;
      if ((IN.type === 'mul' || IN.type === 'div') && IN.text.includes('x')) IN.text = IN.text.replace('x', '');
      renderPad();
    }));
    pad.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => key(b.dataset.k)));
    document.getElementById('applyBtn').addEventListener('click', doApply);
  }
  function refreshEntry() { const v = document.getElementById('val'); if (v) v.innerHTML = entryH(); }

  function setMsg(text, cls = '') {
    msg = { text, cls };
    const m = document.getElementById('msg');
    if (m) { m.className = 'msg ' + cls; m.innerHTML = text; }
  }

  /* ---------- input ---------- */
  function key(k) {
    if (EQ.solved) return;
    let t = IN.text;
    if (k === 'back') t = t.slice(0, -1);
    else if (k === 'clear') t = '';
    else if (k === 'neg') t = t.startsWith('-') ? t.slice(1) : '-' + t;
    else if (k === 'x') { if (IN.type === 'mul' || IN.type === 'div') return; if (!t.includes('x') && !t.endsWith('/')) t += 'x'; }
    else if (k === '/') { if (!t.includes('/') && !t.includes('x') && /\d$/.test(t)) t += '/'; }
    else if (k === 'hint') { fillHint(); return; }
    else if (/\d/.test(k)) { if (t.includes('x')) return; if (t.replace(/\D/g, '').length >= 6) return; t += k; }
    IN.text = t;
    refreshEntry();
  }
  function parseEntry(t, quiet) {
    const m = /^(-?)(\d*)(?:\/(\d+))?(x?)$/.exec(t);
    if (!m) return null;
    const [, sg, num, den, xs] = m;
    if (!num && !xs) return null;
    if (!num && den) return null;
    let n = num ? +num : 1;
    let d = den ? +den : 1;
    if (d === 0) return null;
    return { n: F(sg ? -n : n, d), x: !!xs };
  }

  function fillHint() {
    const h = hintFor(EQ);
    IN.type = h.type;
    const n = h.n;
    IN.text = (n.n < 0 ? '-' : '') + Math.abs(n.n) + (n.d !== 1 ? '/' + n.d : '') + (h.x ? 'x' : '');
    if (h.x && Math.abs(n.n) === 1 && n.d === 1) IN.text = (n.n < 0 ? '-' : '') + 'x';
    EQ.hints++;
    renderPad();
    setMsg(h.text, 'tip');
  }

  function doApply() {
    if (EQ.solved) return;
    if (!IN.text) return setMsg('Type a number first.', 'warn');
    const p = parseEntry(IN.text);
    if (!p) return setMsg('That number is not finished yet. Examples: 5, −3, 2/3, 4x.', 'warn');
    if (p.x && (IN.type === 'mul' || IN.type === 'div')) return setMsg(`Multiplying or dividing by ${X_} would turn this into a different kind of equation.`, 'warn');
    if (isZ(p.n)) {
      if (IN.type === 'div') return setMsg('You can’t divide by 0.', 'warn');
      if (IN.type === 'mul') return setMsg('Multiplying both sides by 0 gives 0 = 0 and loses the equation. Try another number.', 'warn');
      return setMsg(`Adding or subtracting 0 doesn’t change anything.`, 'warn');
    }
    const op = { type: IN.type, n: p.n, x: p.x };
    const last = EQ.rows[EQ.rows.length - 1];
    const L = applyOp(last.L, op), R = applyOp(last.R, op);
    if ([L.a, L.b, R.a, R.b].some(big)) return setMsg('The numbers are getting too big. Try Undo and a different step.', 'warn');
    const atomicL = !!last.Lh, atomicR = !!last.Rh;
    const mid = `${midSide(last.L, last.Lh, atomicL, op)} = ${midSide(last.R, last.Rh, atomicR, op)}`;
    EQ.rows.push({ L, R, op, mid });
    IN.text = '';
    if (isSolved(L, R)) {
      EQ.solved = true;
      const steps = EQ.rows.length - 1;
      let st = steps <= EQ.opt ? 3 : steps <= EQ.opt + 2 ? 2 : 1;
      if (EQ.hints && st === 3) st = 2;
      EQ.stars = st; ST.stars += st; ST.solved++; save();
      render();
      const nb = document.getElementById('nextBtn'); if (nb) nb.focus({ preventScroll: true });
      return;
    }
    if (isZ(L.a) && isZ(R.a)) msg = { text: `Both ${X_} terms are gone. Use Undo and keep ${X_} on one side.`, cls: 'warn' };
    else msg = { text: commentFor(L, R), cls: '' };
    render();
    document.getElementById('work').scrollIntoView({ block: 'nearest' });
  }
  function commentFor(L, R) {
    if (!isZ(L.a) && !isZ(R.a)) return `There is ${X_} on both sides. Try to collect it on one side.`;
    const S = isZ(L.a) ? R : L;
    if (!isZ(S.b)) return `${X_} is not alone yet: there is still a number next to it.`;
    if (!isOne(S.a)) return `Almost there: ${X_} still has a coefficient.`;
    return '';
  }

  function bindCard() {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('undoBtn', () => { if (EQ.rows.length > 1) { EQ.rows.pop(); setMsg(''); render(); } });
    on('hintBtn', fillHint);
    on('newBtn', newEquation);
    on('nextBtn', newEquation);
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest('.chip')) return;
    const k = e.key;
    if (EQ.solved) { if (k === 'Enter') { e.preventDefault(); newEquation(); } return; }
    if (/^\d$/.test(k)) key(k);
    else if (k === 'x' || k === 'X') key('x');
    else if (k === '/') { e.preventDefault(); key('/'); }
    else if (k === '-') key('neg');
    else if (k === 'Backspace') key('back');
    else if (k === 'Enter' && !e.target.closest('button')) { e.preventDefault(); doApply(); }
  });

  renderLevels();
  newEquation();
})();
</script>
</body>
</html>
